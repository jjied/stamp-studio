<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamp Studio & Bead Maker - 邮票与拼豆工坊</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary: #ff6b81;
            --primary-hover: #ff4757;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --radius: 12px;
        }

        .dark-mode {
            --bg-color: #1a1a1a;
            --panel-bg: #2d2d2d;
            --text-color: #f1f1f1;
            --border-color: #404040;
            --primary: #ff6b81;
            --primary-hover: #ff4757;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 顶部署名 */
        .top-credit {
            font-size: 13px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .logo-area h1 {
            font-size: 22px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 主体布局 */
        .main-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-color);
        }

        .tab.active {
            background: var(--panel-bg);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            opacity: 0.8;
        }

        input[type="range"], select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            color: var(--text-color);
        }

        /* 调色盘与色号区 */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
            gap: 4px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .color-chip {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .color-chip.selected {
            border-color: #000;
            transform: scale(1.1);
            z-index: 2;
        }

        /* 画布工作区 */
        .workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: var(--bg-color);
            border-radius: var(--radius);
            border: 2px dashed var(--border-color);
            min-height: 500px;
            overflow: hidden;
            padding: 20px;
        }

        .canvas-toolbar {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .canvas-scroll-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
        }

        #preview-canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: white;
            cursor: crosshair;
        }

        /* 统计与报表 */
        .stats-box {
            font-size: 12px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="light-mode">

    <!-- 顶部署名 -->
    <div class="top-credit">此网站由📕等一场雨季和G老师共同制作</div>

    <header>
        <div class="logo-area">
            <h1>🎨 Stamp & Bead Studio</h1>
        </div>
        <div class="header-controls">
            <button class="btn btn-secondary" id="btn-lang">🌐 中文 / EN</button>
            <button class="btn btn-secondary" id="btn-theme">🌙 切换主题</button>
            <button class="btn" id="btn-save-draft">💾 保存草稿</button>
            <button class="btn btn-secondary" id="btn-load-draft">📂 读取草稿</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 左侧控制面板 -->
        <div class="panel">
            <div class="tabs">
                <div class="tab active" data-mode="stamp">邮票模式</div>
                <div class="tab" data-mode="bead">拼豆 DIY</div>
            </div>

            <!-- 通用/拼豆专属控制 -->
            <div id="bead-controls" style="display:none;" class="control-group">
                <label>底板网格尺寸</label>
                <select id="grid-size-select">
                    <option value="20">20 x 20 (Mini)</option>
                    <option value="26" selected>26 x 26 (Standard)</option>
                    <option value="30">30 x 30 (Large)</option>
                    <option value="50">50 x 50 (Pro)</option>
                </select>

                <label>上传图片转图纸</label>
                <input type="file" id="image-upload" accept="image/*">

                <label>图片缩放大小: <span id="scale-val">100%</span></label>
                <input type="range" id="img-scale" min="20" max="200" value="100">

                <label>画笔形态</label>
                <select id="brush-shape">
                    <option value="1">单点画笔 (1x1)</option>
                    <option value="3">粗笔 (3x3)</option>
                    <option value="cross">十字画笔</option>
                </select>
            </div>

            <!-- 色彩选择器 -->
            <div class="control-group">
                <label>MARD 221 色卡调色盘</label>
                <div class="palette-grid" id="palette-container"></div>
            </div>

            <!-- 统计与报表 -->
            <div class="control-group">
                <label>拼豆用量统计</label>
                <div class="stats-box" id="stats-content">暂无统计数据</div>
            </div>

            <button class="btn" id="btn-export-png" style="width: 100%; justify-content: center;">📥 导出无水印高清 PNG</button>
        </div>

        <!-- 右侧画布工作区 -->
        <div class="workspace">
            <div class="canvas-toolbar">
                <button class="btn btn-secondary" id="btn-undo" title="撤销">↩️ 撤销</button>
                <button class="btn btn-secondary" id="btn-redo" title="重做">🔁 重做</button>
                <button class="btn btn-secondary" id="btn-zoom-in" title="放大">🔍+</button>
                <button class="btn btn-secondary" id="btn-zoom-out" title="缩小">🔍-</button>
                <button class="btn btn-secondary" id="btn-reset-zoom" title="重置视角">1:1</button>
            </div>
            <div class="canvas-scroll-wrapper" id="scroll-wrapper">
                <canvas id="preview-canvas" width="500" height="500"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 完整 221 色 MARD 官方标准色表
        const MARD_RAW = {
            A: 'A1:#FAF4C8,A2:#FFFFD5,A3:#FEFF8B,A4:#FBED56,A5:#F4D738,A6:#FEAC4C,A7:#FE8B4C,A8:#FFDA45,A9:#FF995B,A10:#F77C31,A11:#FFDD99,A12:#FE9F72,A13:#FFC365,A14:#FD543D,A15:#FFF365,A16:#FFFF9F,A17:#FFE36E,A18:#FEBE7D,A19:#FD7C72,A20:#FFD568,A21:#FFE395,A22:#F4F57D,A23:#E6C9B7,A24:#F7F8A2,A25:#FFD67D,A26:#FFC830',
            B: 'B1:#E6EE31,B2:#63F347,B3:#9EF780,B4:#5DE035,B5:#35E352,B6:#65E2A6,B7:#3DAF80,B8:#029D26,B9:#26523A,B10:#95D3C2,B11:#5D722A,B12:#156F40,B13:#D9F794,B14:#ADE945,B15:#2E5132,B16:#C6ED9C,B17:#9BB13A,B18:#E6EE49,B19:#25B88C,B20:#C2F0CC,B21:#146A6B,B22:#0B3C43,B23:#303921,B24:#EEFCA5,B25:#4E846D,B26:#8C7A36,B27:#D1DCC1,B28:#9EE5B9,B29:#C5E254,B30:#ECFBD0,B31:#C4E6B5,B32:#9BAB5A',
            C: 'C1:#E8FFE7,C2:#A9F9FC,C3:#A0E2FB,C4:#41CCFF,C5:#01ACEB,C6:#50AAF0,C7:#3677D2,C8:#0F54C0,C9:#324BCA,C10:#3EBCE2,C11:#28DDDE,C12:#1C334D,C13:#CDE8FF,C14:#D5FDFF,C15:#22C4C6,C16:#1557A8,C17:#04D1F6,C18:#1D3344,C19:#1887A2,C20:#176DAF,C21:#BEDDFF,C22:#67B4BE,C23:#C8E2FF,C24:#7CC4FF,C25:#A9E5E5,C26:#3CAED8,C27:#D3DFFA,C28:#BBCFED,C29:#34488E',
            D: 'D1:#AEB4F2,D2:#858EDD,D3:#2F54AF,D4:#182A84,D5:#B843C5,D6:#AC7BDE,D7:#8854B3,D8:#E2D3FF,D9:#D5B9F8,D10:#361B50,D11:#B9BAE1,D12:#DE9AD4,D13:#B90295,D14:#8B279B,D15:#2F1F90,D16:#E2E1EE,D17:#C4D4F6,D18:#A45EC7,D19:#D8C3D7,D20:#9C32B2,D21:#9A009B,D22:#333995,D23:#EADAFC,D24:#7786E5,D25:#484FC7,D26:#E9C3F6',
            E: 'E1:#FDD3CC,E2:#FEC0DF,E3:#FFB7E7,E4:#E8649E,E5:#F551A2,E6:#F13D74,E7:#C63478,E8:#FFDBE9,E9:#E970CC,E10:#D33793,E11:#FCDDD2,E12:#F78FC3,E13:#B5006D,E14:#FFD1BA,E15:#F8C7C9,E16:#FFF3EB,E17:#FFE2EA,E18:#FFC9D6,E19:#FFD2E7,E20:#D8C7D1,E21:#BD9DA1,E22:#CC78A7,E23:#937A8D,E24:#F6E4F9',
            F: 'F1:#FD957B,F2:#FC3D46,F3:#F74941,F4:#FC283C,F5:#E7002F,F6:#943630,F7:#971937,F8:#BC0127,F9:#E2677A,F10:#A74D22,F11:#6F201F,F12:#FD4D6A,F13:#DD422F,F14:#FFA9AD,F15:#C80020,F16:#FFD9C8,F17:#F79B71,F18:#D37C46,F19:#C1444A,F20:#CD9391,F21:#F4B1B4,F22:#FFD0CB,F23:#F57E66,F24:#FCC1C4,F25:#E54B4F',
            G: 'G1:#FFE2CE,G2:#FFC4AA,G3:#F4C3A5,G4:#E1B383,G5:#EDB045,G6:#E99C17,G7:#9D5B3E,G8:#592A21,G9:#E6B483,G10:#C88135,G11:#E0C593,G12:#EBBB83,G13:#B7714A,G14:#8D614C,G15:#FCF9E0,G16:#F2D9BA,G17:#56403C,G18:#FFE4CC,G19:#E1943A,G20:#A94023,G21:#CB8E77',
            H: 'H1:#FDFBFF,H2:#FEFFFF,H3:#B6B1BA,H4:#89858C,H5:#48464E,H6:#2F2B2F,H7:#000000,H8:#E7D6DB,H9:#E4E7E3,H10:#EEE9EA,H11:#CECDD5,H12:#FFF5ED,H13:#F3E1C9,H14:#CFD7D3,H15:#98A6A8,H16:#3B2F23,H17:#F1EDED,H18:#FFFDF0,H19:#F6EFE2,H20:#949FA3,H21:#F7F3E4,H22:#CACAD5,H23:#9A9D94',
            M: 'M1:#BCC6B8,M2:#8AA386,M3:#697D80,M4:#E3D2BC,M5:#D0CCAA,M6:#B0A782,M7:#B4A497,M8:#B38281,M9:#A58767,M10:#C5B1BC,M11:#9F7494,M12:#644749,M13:#D19066,M14:#C77361,M15:#757D7B'
        };

        // 解析色卡
        let colorPalette = [];
        for (let group in MARD_RAW) {
            MARD_RAW[group].split(',').forEach(item => {
                let [id, hex] = item.split(':');
                colorPalette.push({ id, hex });
            });
        }

        // 应用状态
        let currentMode = 'stamp';
        let gridSize = 26;
        let beadGridData = Array(gridSize).fill(null).map(() => Array(gridSize).fill(null));
        let selectedColor = colorPalette[0].hex;
        let selectedColorId = colorPalette[0].id;
        let zoomLevel = 1.0;
        let isDrawing = false;
        let undoStack = [];
        let redoStack = [];

        // 初始化调色盘
        const paletteContainer = document.getElementById('palette-container');
        colorPalette.forEach((c, index) => {
            const chip = document.createElement('div');
            chip.className = `color-chip ${index === 0 ? 'selected' : ''}`;
            chip.style.backgroundColor = c.hex;
            chip.title = `${c.id} (${c.hex})`;
            chip.onclick = () => {
                document.querySelectorAll('.color-chip').forEach(el => el.classList.remove('selected'));
                chip.classList.add('selected');
                selectedColor = c.hex;
                selectedColorId = c.id;
            };
            paletteContainer.appendChild(chip);
        });

        // 模式切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.dataset.mode;
                document.getElementById('bead-controls').style.display = currentMode === 'bead' ? 'flex' : 'none';
                renderCanvas();
            };
        });

        // 网格尺寸改变保护与调整
        const gridSizeSelect = document.getElementById('grid-size-select');
        gridSizeSelect.onchange = () => {
            let newSize = parseInt(gridSizeSelect.value);
            if (confirm("切换网格大小可能会重新初始化画布，是否保存当前进度？")) {
                saveState();
            }
            gridSize = newSize;
            let newGrid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(null));
            for (let r = 0; r < Math.min(gridSize, beadGridData.length); r++) {
                for (let c = 0; c < Math.min(gridSize, beadGridData[0].length); c++) {
                    newGrid[r][c] = beadGridData[r][c];
                }
            }
            beadGridData = newGrid;
            renderCanvas();
        };

        // 渲染画布
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');

        function renderCanvas() {
            if (currentMode === 'stamp') {
                canvas.width = 400;
                canvas.height = 500;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制基础邮票样式
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(40, 40, 320, 420);
                ctx.strokeStyle = '#dddddd';
                ctx.lineWidth = 2;
                ctx.strokeRect(40, 40, 320, 420);

                // 邮票齿孔边框模拟
                ctx.fillStyle = varColor('--bg-color');
                // 可以在此扩展邮票细节
                ctx.fillStyle = selectedColor;
                ctx.fillRect(60, 60, 280, 260);

                ctx.fillStyle = '#333';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText("MAIL ART STAMP", 60, 360);
                ctx.font = '14px sans-serif';
                ctx.fillText(`Color: ${selectedColorId}`, 60, 390);
            } else {
                // 拼豆格子图纸模式
                let cellSize = Math.floor(450 / gridSize) * zoomLevel;
                canvas.width = gridSize * cellSize;
                canvas.height = gridSize * cellSize;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        let cell = beadGridData[r][c];
                        ctx.fillStyle = cell ? cell.hex : '#ffffff';
                        ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);

                        ctx.strokeStyle = '#e0e0e0';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);

                        // 网格足够大时显示色号文字
                        if (cellSize > 25 && cell) {
                            ctx.fillStyle = '#000000';
                            ctx.font = `${Math.floor(cellSize * 0.35)}px sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(cell.id, (c + 0.5) * cellSize, (r + 0.5) * cellSize);
                        }
                    }
                }
                updateStats();
            }
        }

        function varColor(name) {
            return getComputedStyle(document.body).getPropertyValue(name);
        }

        // 画布交互（绘制与涂抹）
        canvas.onmousedown = (e) => {
            if (currentMode !== 'bead') return;
            isDrawing = true;
            saveState();
            applyBrush(e);
        };

        canvas.onmousemove = (e) => {
            if (!isDrawing || currentMode !== 'bead') return;
            applyBrush(e);
        };

        window.onmouseup = () => { isDrawing = false; };

        function applyBrush(e) {
            const rect = canvas.getBoundingClientRect();
            let cellSize = canvas.width / gridSize;
            let x = Math.floor((e.clientX - rect.left) / cellSize);
            let y = Math.floor((e.clientY - rect.top) / cellSize);

            let brushType = document.getElementById('brush-shape').value;
            let radius = brushType === '3' ? 1 : 0;

            for (let dr = -radius; dr <= radius; dr++) {
                for (let dc = -radius; dc <= radius; dc++) {
                    let nr = y + dr;
                    let nc = x + dc;
                    if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
                        beadGridData[nr][nc] = { id: selectedColorId, hex: selectedColor };
                    }
                }
            }
            renderCanvas();
        }

        // 撤销与重做机制
        function saveState() {
            undoStack.push(JSON.stringify(beadGridData));
            if (undoStack.length > 30) undoStack.shift();
            redoStack = [];
        }

        document.getElementById('btn-undo').onclick = () => {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(beadGridData));
            beadGridData = JSON.parse(undoStack.pop());
            renderCanvas();
        };

        document.getElementById('btn-redo').onclick = () => {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(beadGridData));
            beadGridData = JSON.parse(redoStack.pop());
            renderCanvas();
        };

        // 缩放控制
        document.getElementById('btn-zoom-in').onclick = () => { zoomLevel = Math.min(zoomLevel + 0.2, 2.5); renderCanvas(); };
        document.getElementById('btn-zoom-out').onclick = () => { zoomLevel = Math.max(zoomLevel - 0.2, 0.6); renderCanvas(); };
        document.getElementById('btn-reset-zoom').onclick = () => { zoomLevel = 1.0; renderCanvas(); };

        // 拼豆用量统计
        function updateStats() {
            let counts = {};
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    let cell = beadGridData[r][c];
                    if (cell) {
                        counts[cell.id] = (counts[cell.id] || 0) + 1;
                    }
                }
            }
            let html = '';
            let total = 0;
            for (let id in counts) {
                html += `<div><b>${id}</b>: ${counts[id]}颗</div>`;
                total += counts[id];
            }
            document.getElementById('stats-content').innerHTML = total > 0 ? `总计: ${total} 颗<br>` + html : '暂无拼豆数据';
        }

        // 导出无水印 PNG
        document.getElementById('btn-export-png').onclick = () => {
            const link = document.createElement('a');
            link.download = `stamp-bead-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        // 草稿保存与读取
        document.getElementById('btn-save-draft').onclick = () => {
            localStorage.setItem('stamp_studio_draft', JSON.stringify({ gridSize, beadGridData }));
            alert('草稿保存成功！');
        };

        document.getElementById('btn-load-draft').onclick = () => {
            let draft = localStorage.getItem('stamp_studio_draft');
            if (!draft) { alert('没有找到保存的草稿。'); return; }
            let data = JSON.parse(draft);
            gridSize = data.gridSize;
            gridSizeSelect.value = gridSize;
            beadGridData = data.beadGridData;
            renderCanvas();
            alert('草稿读取成功！');
        };

        // 主题切换
        document.getElementById('btn-theme').onclick = () => {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        };

        // 图片缩放控制器
        const imgScaleInput = document.getElementById('img-scale');
        imgScaleInput.oninput = () => {
            document.getElementById('scale-val').innerText = imgScaleInput.value + '%';
        };

        // 图片上传转图纸
        document.getElementById('image-upload').onchange = (e) => {
            let file = e.target.files[0];
            if (!file) return;
            let img = new Image();
            img.onload = () => {
                let scale = parseInt(imgScaleInput.value) / 100;
                let canvasTemp = document.createElement('canvas');
                canvasTemp.width = gridSize;
                canvasTemp.height = gridSize;
                let tCtx = canvasTemp.getContext('2d');
                
                // 居中按比例绘制并缩放
                let size = Math.min(img.width, img.height) * scale;
                let sx = (img.width - size) / 2;
                let sy = (img.height - size) / 2;
                tCtx.drawImage(img, sx, sy, size, size, 0, 0, gridSize, gridSize);
                let imgData = tCtx.getImageData(0, 0, gridSize, gridSize).data;

                saveState();
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        let idx = (r * gridSize + c) * 4;
                        let red = imgData[idx], green = imgData[idx+1], blue = imgData[idx+2];
                        // 寻找最近的 MARD 颜色
                        let closest = colorPalette[0];
                        let minDist = 999999;
                        colorPalette.forEach(cp => {
                            let cr = parseInt(cp.hex.substr(1,2), 16);
                            let cg = parseInt(cp.hex.substr(3,2), 16);
                            let cb = parseInt(cp.hex.substr(5,2), 16);
                            let dist = Math.pow(red - cr, 2) + Math.pow(green - cg, 2) + Math.pow(blue - cb, 2);
                            if (dist < minDist) {
                                minDist = dist;
                                closest = cp;
                            }
                        });
                        beadGridData[r][c] = { id: closest.id, hex: closest.hex };
                    }
                }
                renderCanvas();
            };
            img.src = URL.createObjectURL(file);
        };

        // 初始渲染
        renderCanvas();
    </script>
</body>
</html>
