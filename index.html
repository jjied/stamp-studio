<!DOCTYPE html>
<html lang="ZH-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Architects+Daughter&family=Caveat:wght@400;500;600;700&family=Comic+Neue:wght@400;700&family=Gaegu:wght@400;700&family=Gloria+Hallelujah&family=Gochi+Hand&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Ma+Shan+Zheng&family=Nanum+Pen+Script&family=Patrick+Hand&family=Permanent+Marker&family=Reenie+Beanie&family=Shadows+Into+Light&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<title>Stamp Studio · 法式蕾丝邮票工坊 v2.8</title>
<style>
:root {
    --bg-desk: #f4e9df;
    --bg-card: #fff9f2;
    --bg-sub: #fbf1e9;
    --ink: #795c52;
    --ink-soft: #a18478;
    --line: #e8cfc1;
    --pink: #d99aa0;
    --pink-dark: #c9828c;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body {
    background-color: var(--bg-desk);
    background-image: radial-gradient(ellipse at 15% 10%, rgba(255,255,255,.82), transparent 42%), radial-gradient(ellipse at 85% 85%, rgba(225,183,170,.22), transparent 40%), repeating-linear-gradient(0deg, rgba(153,118,94,.025) 0 1px, transparent 1px 4px);
    color: var(--ink);
    padding: 14px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    font-family: 'Caveat', 'Comic Neue', 'Patrick Hand', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    user-select: none;
}
.app-shell {
    width: 100%;
    max-width: 1280px;
    background: var(--bg-card);
    border: 1px solid #e4c7b8;
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    box-shadow: 0 18px 48px rgba(119,83,68,.14), inset 0 0 5px rgba(255,255,255,.58);
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.credit-bar {
    background: #EFE7DA;
    border-bottom: 1px solid #E1D6C5;
    padding: 7px 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    color: #3B322C;
    letter-spacing: 0.4px;
}
.top-nav {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--bg-card);
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-badge {
    width: 36px; height: 36px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    background: var(--ink); color: #FFF;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px;
}
.brand-title { font-size: 18px; font-weight: 900; letter-spacing: 0.8px; }
.brand-sub { font-size: 12px; color: var(--ink-soft); }
.mode-tabs {
    display: flex; background: #F1EBE0; padding: 3px;
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; border: 1px solid #E1D6C5;
}
.mode-btn {
    border: none; background: transparent; color: var(--ink-soft);
    padding: 6px 13px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 13px; font-weight: 800;
    cursor: pointer; transition: 0.15s;
}
.mode-btn.active { background: var(--ink); color: #FFF; }
.btn-export {
    border: none; background: var(--pink); color: #FFF;
    padding: 7px 14px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 13px; font-weight: 800;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.btn-export:active { transform: scale(0.96); background: var(--pink-dark); }
.workspace {
    display: grid;
    grid-template-columns: 1fr;
}
@media (min-width: 960px) {
    .workspace { grid-template-columns: 1fr 1fr; }
}
.stage-col {
    background: var(--bg-sub);
    border-bottom: 1px solid var(--line);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}
@media (min-width: 960px) {
    .stage-col { border-bottom: none; border-right: 1px solid var(--line); }
}
.stage-top-bar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
}
.ratio-group {
    display: inline-flex; background: #ECE4D6; padding: 2px;
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; border: 1px solid #DDD2C0;
}
.ratio-btn {
    border: none; background: transparent; color: var(--ink-soft);
    padding: 4px 9px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 12px; font-weight: 800; cursor: pointer;
}
.ratio-btn.active { background: var(--ink); color: #FFF; }
.mini-act-btn {
    border: 1px solid #D9CEBC; background: #FFFDF9; color: var(--ink);
    padding: 4px 10px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 12px; font-weight: 800; cursor: pointer;
}
.mini-act-btn.danger { background: #FDE8EC; border-color: #F3B8C5; color: #B84A58; }
.stage-hint {
    background: #EFE7DA; color: #5E544E;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; text-align: center;
}
.canvas-holder {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
}
.aspect-1-1 { width: 100%; max-width: 395px; aspect-ratio: 1 / 1; }
.aspect-3-4 { width: 80%; max-width: 320px; aspect-ratio: 3 / 4; }
.aspect-4-3 { width: 100%; max-width: 420px; aspect-ratio: 4 / 3; }
#stampCanvas {
    width: 100%; height: 100%; display: block; touch-action: none;
    filter: drop-shadow(0 12px 22px rgba(35, 31, 32, 0.16));
}
.stage-footer {
    width: 100%; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; justify-content: center;
}
.btn-export-big {
    border: none; background: var(--ink); color: #FFF;
    padding: 10px 20px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 13px; font-weight: 800; cursor: pointer;
}
.ctrl-col {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
@media (min-width: 960px) {
    .ctrl-col { max-height: 84vh; overflow-y: auto; }
}
.card-box {
    background: var(--bg-sub);
    border: 1px dashed var(--pink);
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
}
.card-head {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px;
}
.card-title { font-size: 13px; font-weight: 900; color: var(--ink); }
.row-flex { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.sub-lbl { font-size: 12px; font-weight: 700; color: #5E544E; }
.divider { height: 1px; background: #E5DCCD; width: 100%; }

/* Animal / Stamp Selection grid with irregular hand-drawn borders */
.animal-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}
@media (min-width: 520px) {
    .animal-grid { grid-template-columns: repeat(6, 1fr); }
}
.animal-btn {
    border: 1px solid var(--pink);
    background: #FFFDF9;
    color: #4A413C;
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    padding: 6px 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.12s;
}
.animal-btn.active {
    background: var(--ink);
    color: #FFF;
    border-color: var(--ink);
}
.animal-thumb {
    width: 40px; height: 40px; display: block; flex: 0 0 auto;
}
.animal-none-icon, .animal-photo-icon {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;
}
.animal-btn span {
    font-size: 11px; line-height: 1.15; margin-top: 3px; font-weight: 700; white-space: nowrap;
}

/* General UI Controls & Sliders */
.swatch-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.swatch-dot {
    width: 22px; height: 22px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    border: 1.5px solid #C8BCAE; cursor: pointer; transition: 0.12s;
}
.swatch-dot.active {
    transform: scale(1.12);
    box-shadow: 0 0 2px #FFFDF9, 0 0 4px var(--ink);
}
.color-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px 3px 4px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    background: #F4EFE6; border: 1px solid #D8CEBE;
    font-size: 11px; font-family: monospace; font-weight: 800;
}
.color-pill input[type="color"] {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border: none; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; padding: 0; background: transparent; cursor: pointer;
}
input[type="range"] { -webkit-appearance: none; background: transparent; vertical-align: middle; height: 4px; background: #DDD3C3; border-radius: 999px; width: 100%; }
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    background: var(--ink); border: 2px solid #FFF; cursor: pointer;
}
.opt-btn {
    border: 1px solid var(--pink); background: #FFFDF9; color: var(--ink-soft);
    padding: 6px 6px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 12px; font-weight: 800; cursor: pointer;
}
.opt-btn.active { background: var(--ink); color: #FFF; border-color: var(--ink); }

.txt-input, .sel-input {
    background: #FFFDF9; border: 1px solid #D8CEBE; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    padding: 8px 10px; font-size: 13px; font-weight: 700; color: var(--ink); font-family: inherit; width: 100%;
}
.txt-input:focus, .sel-input:focus { outline: none; border-color: var(--ink); }
textarea.txt-input { resize: none; line-height: 1.35; }

/* Pixel perler beads specific tabs & grids */
.bead-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 3px; }
.bead-tab {
    border: 1px solid var(--pink); background: #FFFDF9; color: var(--ink-soft);
    padding: 5px 10px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; font-size: 12px; font-weight: 800; white-space: nowrap; cursor: pointer;
}
.bead-tab.active { background: var(--ink); color: #FFF; border-color: var(--ink); }
.bead-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 220px; overflow-y: auto; padding: 2px;
}
@media (min-width: 520px) { .bead-grid { grid-template-columns: repeat(7, 1fr); } }
.bead-cell-btn {
    border: 1px solid var(--pink); background: #FFFDF9; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    padding: 6px 3px; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 10px; font-family: monospace; font-weight: 800; color: var(--ink);
}
.bead-cell-btn.active { background: var(--ink); color: #FFF; border-color: var(--ink); }
.bead-circle { width: 20px; height: 20px; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; border: 1px solid #B8AAA0; margin-bottom: 3px; box-shadow: inset 0 0 1px rgba(255,255,255,0.65); }

.toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #FFF; padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,0.22);
    opacity: 0; pointer-events: none; transition: 0.25s; z-index: 99;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="credit-bar">Stamp Studio · 法式蕾丝邮票工坊 v2.8 (手绘异形版)</div>
  <div class="top-nav">
    <div class="brand">
      <div class="brand-badge">S</div>
      <div>
        <div class="brand-title">Stamp Studio</div>
        <div class="brand-sub">法式复古邮票与像素拼豆工坊</div>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-btn active" data-mode="stamp">邮票创作</button>
      <button class="mode-btn" data-mode="beads">像素拼豆</button>
    </div>
    <button class="btn-export" id="topExportBtn">📥 导出作品</button>
  </div>

  <div class="workspace">
    <!-- 左侧预览区 -->
    <div class="stage-col">
      <div class="stage-top-bar">
        <div class="ratio-group" id="ratioGroup">
          <button class="ratio-btn active" data-ratio="1-1">1:1 正方形</button>
          <button class="ratio-btn" data-ratio="3-4">3:4 竖版</button>
          <button class="ratio-btn" data-ratio="4-3">4:3 横版</button>
        </div>
        <div class="sub-lbl" id="canvasInfo">尺寸: 800 × 800 px</div>
      </div>
      <div class="stage-hint" id="stageHint">点击下方动物或自定义上传来妆点您的作品</div>
      <div class="canvas-holder">
        <div id="aspect-box" class="aspect-1-1">
          <canvas id="stampCanvas" width="800" height="800"></canvas>
        </div>
      </div>
      <div class="stage-footer">
        <button class="btn-export-big" id="bottomExportBtn">✨ 生成高清图像并下载</button>
      </div>
    </div>

    <!-- 右侧控制区 -->
    <div class="ctrl-col" id="ctrlCol">
      <!-- 邮票模式控制区 -->
      <div id="panelStamp" class="card-box">
        <div class="card-head">
          <div class="card-title">🐾 核心小动物与花边元素</div>
          <div class="sub-lbl">点击切换主题</div>
        </div>
        <div class="animal-grid" id="animalGrid">
          <!-- 动态生成动物选项 -->
        </div>

        <div class="divider"></div>
        <div class="card-title">📤 自定义图片上传</div>
        <div class="row-flex">
          <input type="file" id="customImgUpload" accept="image/*" style="display:none">
          <button class="opt-btn" id="uploadImgBtn" style="flex:1">📁 选择本地图片</button>
          <button class="opt-btn danger" id="clearImgBtn">清除图片</button>
        </div>

        <!-- 像素拼豆区 / 上传图片调整大小面板 -->
        <div class="divider"></div>
        <div class="card-title">🎚️ 图片缩放与位置调整</div>
        <div class="row-flex">
          <span class="sub-lbl">缩放大小 (Scale)</span>
          <span id="scaleVal" class="sub-lbl">100%</span>
        </div>
        <input type="range" id="imgScaleRange" min="20" max="300" value="100">

        <div class="divider"></div>
        <div class="card-title">✍️ 邮票齿孔与边框样式</div>
        <div class="row-flex">
          <span class="sub-lbl">齿孔密度</span>
          <input type="range" id="perforationsRange" min="10" max="60" value="28" style="width: 140px;">
        </div>
      </div>

      <!-- 像素拼豆模式控制区 -->
      <div id="panelBeads" class="card-box" style="display:none;">
        <div class="card-head">
          <div class="card-title">🎨 像素拼豆转换区</div>
          <div class="sub-lbl">支持任意图片转拼豆图纸</div>
        </div>
        <div class="row-flex">
          <span class="sub-lbl">拼豆网格密度</span>
          <input type="range" id="beadGridSize" min="16" max="64" value="32" style="width: 140px;">
        </div>
        <div class="bead-tabs" id="beadPaletteTabs">
          <button class="bead-tab active" data-palette="perler">Perler 经典色系</button>
          <button class="bead-tab" data-palette="artkal">Artkal 莫兰迪色</button>
        </div>
        <div class="sub-lbl">点击色块可进行点阵微调修补</div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toastMsg">操作成功</div>

<script>
// 基础逻辑框架
const canvas = document.getElementById('stampCanvas');
const ctx = canvas.getContext('2d');
let currentMode = 'stamp';
let currentRatio = '1-1';
let currentAnimal = 'rabbit';
let customImage = null;
let imgScale = 1;
let imgX = 0, imgY = 0;
let perfCount = 28;

// 动物列表与SVG小图标/路径定义
const animals = [
  { id: 'rabbit', name: '小兔', icon: '🐰' },
  { id: 'cat', name: '小猫', icon: '🐱' },
  { id: 'bear', name: '小熊', icon: '🐻' },
  { id: 'fox', name: '小狐', icon: '🦊' },
  { id: 'deer', name: '小鹿', icon: '🦌' },
  { id: 'duck', name: '小鸭', icon: '🦆' },
  { id: 'bird', name: '小鸟', icon: '🐦' },
  { id: 'custom', name: '自定义', icon: '📁' },
  { id: 'none', name: '无动物', icon: '✨' }
];

function initAnimalGrid() {
  const grid = document.getElementById('animalGrid');
  grid.innerHTML = '';
  animals.forEach(a => {
    const btn = document.createElement('button');
    btn.className = `animal-btn ${a.id === currentAnimal ? 'active' : ''}`;
    btn.innerHTML = `<div class="animal-none-icon">${a.icon}</div><span>${a.name}</span>`;
    btn.onclick = () => {
      document.querySelectorAll('.animal-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentAnimal = a.id;
      if (a.id === 'custom') {
        document.getElementById('customImgUpload').click();
      } else {
        drawCanvas();
      }
    };
    grid.appendChild(btn);
  });
}

function showToast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Canvas 渲染邮票主函数
function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 背景填充
  ctx.fillStyle = '#fff9f2';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 邮票内边框与复古装饰
  ctx.strokeStyle = '#795c52';
  ctx.lineWidth = 4;
  ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

  // 如果有自定义图片或动物绘制
  if (customImgObj) {
    ctx.save();
    ctx.translate(canvas.width / 2 + imgX, canvas.height / 2 + imgY);
    ctx.scale(imgScale, imgScale);
    let dw = customImgObj.width;
    let dh = customImgObj.height;
    ctx.drawImage(customImgObj, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  } else {
    // 绘制可爱动物占位或简笔插画
    ctx.font = 'bold 120px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let icon = animals.find(a => a.id === currentAnimal)?.icon || '🐰';
    ctx.fillText(icon, canvas.width / 2, canvas.height / 2 - 40);

    ctx.font = 'bold 36px "Caveat", cursive';
    ctx.fillStyle = '#795c52';
    ctx.fillText('Stamp Studio · 法式蕾丝邮票', canvas.width / 2, canvas.height - 140);
  }

  // 绘制齿孔效果
  drawPerforations();
}

function drawPerforations() {
  ctx.fillStyle = '#f4e9df';
  let stepW = canvas.width / perfCount;
  let stepH = canvas.height / perfCount;
  
  for(let i=0; i<perfCount; i++) {
    // 上下齿孔
    ctx.beginPath();
    ctx.arc(i * stepW + stepW/2, 20, 8, 0, Math.PI * 2);
    ctx.arc(i * stepW + stepW/2, canvas.height - 20, 8, 0, Math.PI * 2);
    ctx.fill();
    // 左右齿孔
    ctx.beginPath();
    ctx.arc(20, i * stepH + stepH/2, 8, 0, Math.PI * 2);
    ctx.arc(canvas.width - 20, i * stepH + stepH/2, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

let customImgObj = null;

// 上传图片处理与缩放绑定
document.getElementById('uploadImgBtn').onclick = () => {
  document.getElementById('customImgUpload').click();
};

document.getElementById('customImgUpload').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      customImgObj = img;
      imgScale = 1;
      document.getElementById('imgScaleRange').value = 100;
      document.getElementById('scaleVal').textContent = '100%';
      drawCanvas();
      showToast('图片加载成功，可通过滑块调整大小');
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

document.getElementById('clearImgBtn').onclick = () => {
  customImgObj = null;
  drawCanvas();
  showToast('已清除自定义图片');
};

document.getElementById('imgScaleRange').oninput = (e) => {
  imgScale = e.target.value / 100;
  document.getElementById('scaleVal').textContent = e.target.value + '%';
  drawCanvas();
};

document.getElementById('perforationsRange').oninput = (e) => {
  perfCount = parseInt(e.target.value);
  drawCanvas();
};

// 模式切换
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    if (currentMode === 'stamp') {
      document.getElementById('panelStamp').style.display = 'flex';
      document.getElementById('panelBeads').style.display = 'none';
    } else {
      document.getElementById('panelStamp').style.display = 'none';
      document.getElementById('panelBeads').style.display = 'flex';
    }
  };
});

// 比例切换
document.querySelectorAll('.ratio-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRatio = btn.dataset.ratio;
    const box = document.getElementById('aspect-box');
    box.className = `aspect-${currentRatio}`;
    if (currentRatio === '1-1') { canvas.width = 800; canvas.height = 800; document.getElementById('canvasInfo').textContent = '尺寸: 800 × 800 px'; }
    else if (currentRatio === '3-4') { canvas.width = 600; canvas.height = 800; document.getElementById('canvasInfo').textContent = '尺寸: 600 × 800 px'; }
    else if (currentRatio === '4-3') { canvas.width = 800; canvas.height = 600; document.getElementById('canvasInfo').textContent = '尺寸: 800 × 600 px'; }
    drawCanvas();
  };
});

// 导出按钮
function exportWork() {
  const link = document.createElement('a');
  link.download = 'stamp-studio-work.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('作品已成功导出');
}
document.getElementById('topExportBtn').onclick = exportWork;
document.getElementById('bottomExportBtn').onclick = exportWork;

// 初始化
initAnimalGrid();
drawCanvas();
</script>
</body>
</html>
