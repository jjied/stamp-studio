<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY STAMP GENERATOR - 手绘治愈系邮票生成器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
        }
        .logo-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }
        .top-btn {
            background: #2d2d2d;
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .top-btn:active { transform: scale(0.95); background: #ff758c; }
        
        /* 预览舞台 */
        .preview-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #181818;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            width: 90%;
            height: 90%;
            object-fit: contain;
            cursor: crosshair;
        }
        .canvas-tip {
            position: absolute;
            bottom: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #aaa;
            pointer-events: none;
        }
        .reset-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(45, 45, 45, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }

        /* 控制面板区 */
        .panel {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        /* 颜色选择器 */
        .color-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .color-btn.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        /* 动物网格 */
        .grid-animals {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .animal-card {
            background: #252525;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .animal-card.active {
            border-color: #ff758c;
            background: #2d2328;
        }
        .animal-card span {
            font-size: 10px;
            color: #bbb;
        }

        /* 输入框与滑块 */
        .input-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #ff758c; }
        
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #aaa;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #ff758c;
        }

        /* 底部操作大按钮 */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .main-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
        }
        .sec-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #3a3a3a;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">💌 MY STAMP GENERATOR</div>
        <button class="top-btn" onclick="randomizeStamp()">✨ 随机灵感</button>
    </header>

    <!-- 预览画布 -->
    <div class="preview-box">
        <button class="reset-btn" onclick="resetElements()">归位元素</button>
        <canvas id="stampCanvas" width="1080" height="1080"></canvas>
        <div class="canvas-tip">可直接拖动画布上的图案、文字与邮戳</div>
    </div>

    <!-- 控制面板 -->
    <div class="panel">
        <div>
            <div class="section-title">选择纸张颜色</div>
            <div class="color-row" id="paperColorRow"></div>
        </div>

        <div>
            <div class="section-title">选择边框齿色</div>
            <div class="color-row" id="borderColorRow"></div>
        </div>

        <div>
            <div class="section-title">选择手绘角色 / 上传照片</div>
            <div class="grid-animals" id="animalGrid"></div>
            <input type="file" id="photoUpload" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event)">
        </div>

        <div>
            <div class="section-title">手写文案</div>
            <div class="input-group">
                <input type="text" id="stampText" value="I CAN'T TAKE THIS CUTENESS" oninput="drawStamp()">
            </div>
        </div>

        <div class="action-row">
            <button class="sec-btn" onclick="randomizeStamp()">换个搭配</button>
            <button class="main-btn" onclick="saveImage()">💾 保存高清水印图</button>
        </div>
    </div>
</div>

<script>
    // 基础状态
    let state = {
        paperColor: '#ffd1dc', // 樱花粉
        borderColor: '#ffffff', // 纯白
        currentAnimal: 'dog',
        customPhotoImg: null,
        text: "I CAN'T TAKE THIS CUTENESS",
        // 元素位置
        animalPos: { x: 540, y: 460, scale: 1 },
        textPos: { x: 540, y: 820 },
    };

    const paperColors = [
        { name: '樱花粉', hex: '#ffd1dc' },
        { name: '奶油黄', hex: '#fff4bd' },
        { name: '天空蓝', hex: '#d0f0fd' },
        { name: '薄荷绿', hex: '#d4edda' },
        { name: '香芋紫', hex: '#e8dff5' },
        { name: '米白', hex: '#fdfbf7' },
        { name: '牛皮纸', hex: '#f3e5ab' }
    ];

    const borderColors = [
        { name: '纯白', hex: '#ffffff' },
        { name: '奶油', hex: '#fff8dc' },
        { name: '粉红', hex: '#ffb6c1' },
        { name: '浅绿', hex: '#98fb98' },
        { name: '浅蓝', hex: '#87cefa' },
        { name: '浅紫', hex: '#dda0dd' }
    ];

    const animals = [
        { id: 'upload', name: '相册上传', icon: '📁' },
        { id: 'dog', name: '小狗', icon: '🐶' },
        { id: 'cat', name: '小猫', icon: '🐱' },
        { id: 'bunny', name: '小兔', icon: '🐰' },
        { id: 'bear', name: '小熊', icon: '🐻' },
        { id: 'fox', name: '小狐狸', icon: '🦊' },
        { id: 'pig', name: '小猪', icon: '🐷' },
        { id: 'penguin', name: '企鹅', icon: '🐧' },
        { id: 'frog', name: '青蛙', icon: '🐸' },
        { id: 'duck', name: '小鸭', icon: '🐥' },
        { id: 'hedgehog', name: '刺猬', icon: '🦔' },
        { id: 'hamster', name: '仓鼠', icon: '🐹' },
        { id: 'weasel', name: '雪鼬', icon: '🦦' },
        { id: 'fish', name: '小鱼', icon: '🐠' },
        { id: 'tiger', name: '小老虎', icon: '🐯' },
        { id: 'textonly', name: '仅文字', icon: '📝' }
    ];

    // 初始化界面
    function initUI() {
        // 纸张颜色
        const pRow = document.getElementById('paperColorRow');
        paperColors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${c.hex === state.paperColor ? 'active' : ''}`;
            btn.style.background = c.hex;
            btn.onclick = () => { state.paperColor = c.hex; updateUI(); };
            pRow.appendChild(btn);
        });

        // 边框颜色
        const bRow = document.getElementById('borderColorRow');
        borderColors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${c.hex === state.borderColor ? 'active' : ''}`;
            btn.style.background = c.hex;
            btn.onclick = () => { state.borderColor = c.hex; updateUI(); };
            bRow.appendChild(btn);
        });

        // 动物网格
        const aGrid = document.getElementById('animalGrid');
        animals.forEach(a => {
            const card = document.createElement('div');
            card.className = `animal-card ${a.id === state.currentAnimal ? 'active' : ''}`;
            card.innerHTML = `<span style="font-size:22px;">${a.icon}</span><span>${a.name}</span>`;
            card.onclick = () => {
                if (a.id === 'upload') {
                    document.getElementById('photoUpload').click();
                } else {
                    state.currentAnimal = a.id;
                    state.customPhotoImg = null;
                    updateUI();
                }
            };
            aGrid.appendChild(card);
        });
    }

    function updateUI() {
        document.querySelectorAll('#paperColorRow .color-btn').forEach((b, i) => {
            b.classList.toggle('active', paperColors[i].hex === state.paperColor);
        });
        document.querySelectorAll('#borderColorRow .color-btn').forEach((b, i) => {
            b.classList.toggle('active', borderColors[i].hex === state.borderColor);
        });
        document.querySelectorAll('.animal-card').forEach((c, i) => {
            c.classList.toggle('active', animals[i].id === state.currentAnimal);
        });
        drawStamp();
    }

    function handlePhotoUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                state.customPhotoImg = img;
                state.currentAnimal = 'upload';
                updateUI();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function resetElements() {
        state.animalPos = { x: 540, y: 460, scale: 1 };
        state.textPos = { x: 540, y: 820 };
        drawStamp();
    }

    function randomizeStamp() {
        state.paperColor = paperColors[Math.floor(Math.random() * paperColors.length)].hex;
        state.borderColor = borderColors[Math.floor(Math.random() * borderColors.length)].hex;
        const randAnim = animals.filter(a => a.id !== 'upload')[Math.floor(Math.random() * (animals.length - 1))];
        state.currentAnimal = randAnim.id;
        state.customPhotoImg = null;
        resetElements();
    }

    // 核心绘画引擎
    const canvas = document.getElementById('stampCanvas');
    const ctx = canvas.getContext('2d');

    function drawStamp() {
        ctx.clearRect(0, 1080, 1080, 1080);
        
        // 1. 绘制邮票带齿轮外框
        ctx.save();
        ctx.fillStyle = state.borderColor;
        ctx.fillRect(80, 80, 920, 920);

        // 齿孔剪切
        ctx.globalCompositeOperation = 'destination-out';
        const teethCount = 14;
        const step = 920 / teethCount;
        for (let i = 0; i <= teethCount; i++) {
            // 上下
            if (i < teethCount) {
                ctx.beginPath(); ctx.arc(80 + i * step + step/2, 80, 24, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(80 + i * step + step/2, 1000, 24, 0, Math.PI * 2); ctx.fill();
            }
            // 左右
            if (i < teethCount) {
                ctx.beginPath(); ctx.arc(80, 80 + i * step + step/2, 24, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(1000, 80 + i * step + step/2, 24, 0, Math.PI * 2); ctx.fill();
            }
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();

        // 2. 邮票内芯背景
        ctx.save();
        ctx.beginPath();
        ctx.rect(120, 120, 840, 840);
        ctx.clip();
        ctx.fillStyle = state.paperColor;
        ctx.fillRect(120, 120, 840, 840);
        ctx.restore();

        // 3. 绘制中央动物图案
        ctx.save();
        ctx.translate(state.animalPos.x, state.animalPos.y);
        ctx.scale(state.animalPos.scale, state.animalPos.scale);
        drawAnimalContent();
        ctx.restore();

        // 4. 绘制文字
        ctx.save();
        ctx.translate(state.textPos.x, state.textPos.y);
        ctx.font = "bold 52px monospace";
        ctx.fillStyle = "#222";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const currentText = document.getElementById('stampText').value || state.text;
        ctx.fillText(currentText, 0, 0);
        ctx.restore();
    }

    function drawAnimalContent() {
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.fillStyle = "#fff";

        if (state.currentAnimal === 'upload' && state.customPhotoImg) {
            ctx.beginPath();
            ctx.arc(0, 0, 180, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(state.customPhotoImg, -180, -180, 360, 360);
            return;
        }

        // 简化绘制代表性小动物简笔画
        ctx.beginPath();
        if (state.currentAnimal === 'dog') {
            ctx.ellipse(0, 0, 160, 120, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            // 耳头
            ctx.beginPath(); ctx.arc(-140, -40, 60, 0, Math.PI * 2); ctx.fillStyle="#fff"; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(140, -40, 60, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else if (state.currentAnimal === 'cat') {
            ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            // 猫耳
            ctx.beginPath(); ctx.moveTo(-120, -80); ctx.lineTo(-160, -180); ctx.lineTo(-60, -130); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(120, -80); ctx.lineTo(160, -180); ctx.lineTo(60, -130); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
            // 默认可爱圆形小动物脸
            ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        
        // 统一小眼睛和鼻子
        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(-40, -20, 12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(40, -20, 12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 15, 10, 0, Math.PI*2); ctx.fill();
    }

    // 拖拽交互支持
    let isDragging = false;
    let activeTarget = 'animal'; // 'animal' 或 'text'
    let startX, startY;

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        // 简单判断点中文字还是动物
        if (Math.abs(y - state.textPos.y) < 80) {
            activeTarget = 'text';
        } else {
            activeTarget = 'animal';
        }
        isDragging = true;
        startX = x;
        startY = y;
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const dx = x - startX;
        const dy = y - startY;
        startX = x;
        startY = y;

        if (activeTarget === 'animal') {
            state.animalPos.x += dx;
            state.animalPos.y += dy;
        } else {
            state.textPos.x += dx;
            state.textPos.y += dy;
        }
        drawStamp();
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // 导出图片
    function saveImage() {
        const link = document.createElement('a');
        link.download = 'my-cute-stamp.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // 初始化执行
    initUI();
    drawStamp();
</script>

</body>
    </html>
