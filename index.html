<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY STAMP GENERATOR - 手绘治愈系邮票生成器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
        }
        .logo-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }
        .top-btn {
            background: #2d2d2d;
            border: none;
            color: #ff758c;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* 预览舞台 */
        .preview-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #181818;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            width: 92%;
            height: 92%;
            object-fit: contain;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        
        .canvas-tip {
            position: absolute;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #aaa;
            pointer-events: none;
        }
        .reset-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(45, 45, 45, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
        }

        /* 控制面板卡片 */
        .panel {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .section-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .color-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
        }
        .color-btn.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        /* 动物网格 */
        .grid-animals {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }
        .animal-card {
            background: #252525;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }
        .animal-card.active {
            border-color: #ff758c;
            background: #2d2328;
        }
        .animal-card span {
            font-size: 9px;
            color: #bbb;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #ff758c; }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .main-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
            text-align: center;
        }
        .sec-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #3a3a3a;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">💌 MY STAMP GENERATOR</div>
        <button class="top-btn" onclick="randomizeAll()">✨ 随机搭配</button>
    </header>

    <!-- 预览画布 -->
    <div class="preview-box">
        <button class="reset-btn" onclick="resetPositions()">重置位置</button>
        <canvas id="stampCanvas" width="1080" height="1080"></canvas>
        <div class="canvas-tip">可直接拖拽动物、文字、邮戳与角标</div>
    </div>

    <!-- 控制面板 -->
    <div class="panel">
        <div>
            <div class="section-title">纸张背景色</div>
            <div class="color-row" id="paperColorRow"></div>
        </div>

        <div>
            <div class="section-title">齿边框颜色</div>
            <div class="color-row" id="borderColorRow"></div>
        </div>

        <div>
            <div class="section-title">选择角色 / 上传相册照片</div>
            <div class="grid-animals" id="animalGrid"></div>
            <input type="file" id="photoUpload" accept="image/*" style="display:none;" onchange="handlePhoto(event)">
        </div>

        <div>
            <div class="section-title">手写文案</div>
            <div class="input-group">
                <input type="text" id="stampText" value="I CAN'T TAKE THIS CUTENESS" oninput="redraw()">
            </div>
        </div>

        <div>
            <div class="section-title">趣味面值角标</div>
            <div class="input-group">
                <input type="text" id="badgeText" value="100% CUTE" oninput="redraw()">
            </div>
        </div>

        <div class="action-row">
            <button class="sec-btn" onclick="randomizeAll()">换个灵感</button>
            <button class="main-btn" onclick="savePNG()">💾 保存高清 PNG</button>
        </div>
    </div>
</div>

<script>
    let state = {
        paperColor: '#ffd1dc',
        borderColor: '#ffffff',
        animal: 'dog',
        customImg: null,
        text: "I CAN'T TAKE THIS CUTENESS",
        badgeText: "100% CUTE",
        // 元素位置与状态
        animalPos: { x: 540, y: 460, scale: 1 },
        textPos: { x: 540, y: 820 },
        postmarkPos: { x: 800, y: 260 },
        badgePos: { x: 880, y: 180 }
    };

    const paperColors = [
        { hex: '#ffd1dc' }, { hex: '#fff4bd' }, { hex: '#d0f0fd' }, 
        { hex: '#d4edda' }, { hex: '#e8dff5' }, { hex: '#fdfbf7' }, { hex: '#f3e5ab' }
    ];

    const borderColors = [
        { hex: '#ffffff' }, { hex: '#fff8dc' }, { hex: '#ffb6c1' }, 
        { hex: '#98fb98' }, { hex: '#87cefa' }, { hex: '#dda0dd' }
    ];

    const animals = [
        { id: 'upload', name: '相册上传', icon: '📁' },
        { id: 'dog', name: '小狗', icon: '🐶' },
        { id: 'cat', name: '小猫', icon: '🐱' },
        { id: 'bunny', name: '小兔', icon: '🐰' },
        { id: 'bear', name: '小熊', icon: '🐻' },
        { id: 'fox', name: '小狐狸', icon: '🦊' },
        { id: 'pig', name: '小猪', icon: '🐷' },
        { id: 'penguin', name: '企鹅', icon: '🐧' },
        { id: 'frog', name: '青蛙', icon: '🐸' },
        { id: 'duck', name: '小鸭', icon: '🐥' },
        { id: 'hedgehog', name: '刺猬', icon: '🦔' },
        { id: 'hamster', name: '仓鼠', icon: '🐹' },
        { id: 'fish', name: '小鱼', icon: '🐠' },
        { id: 'tiger', name: '小老虎', icon: '🐯' }
    ];

    function initUI() {
        const pRow = document.getElementById('paperColorRow');
        paperColors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${c.hex === state.paperColor ? 'active' : ''}`;
            btn.style.background = c.hex;
            btn.onclick = () => { state.paperColor = c.hex; updateUI(); };
            pRow.appendChild(btn);
        });

        const bRow = document.getElementById('borderColorRow');
        borderColors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${c.hex === state.borderColor ? 'active' : ''}`;
            btn.style.background = c.hex;
            btn.onclick = () => { state.borderColor = c.hex; updateUI(); };
            bRow.appendChild(btn);
        });

        const aGrid = document.getElementById('animalGrid');
        animals.forEach(a => {
            const card = document.createElement('div');
            card.className = `animal-card ${a.id === state.animal ? 'active' : ''}`;
            card.innerHTML = `<span style="font-size:20px;">${a.icon}</span><span>${a.name}</span>`;
            card.onclick = () => {
                if (a.id === 'upload') {
                    document.getElementById('photoUpload').click();
                } else {
                    state.animal = a.id;
                    state.customImg = null;
                    updateUI();
                }
            };
            aGrid.appendChild(card);
        });
    }

    function updateUI() {
        document.querySelectorAll('#paperColorRow .color-btn').forEach((b, i) => {
            b.classList.toggle('active', paperColors[i].hex === state.paperColor);
        });
        document.querySelectorAll('#borderColorRow .color-btn').forEach((b, i) => {
            b.classList.toggle('active', borderColors[i].hex === state.borderColor);
        });
        document.querySelectorAll('.animal-card').forEach((c, i) => {
            c.classList.toggle('active', animals[i].id === state.animal);
        });
        redraw();
    }

    function handlePhoto(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                state.customImg = img;
                state.animal = 'upload';
                updateUI();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function resetPositions() {
        state.animalPos = { x: 540, y: 460, scale: 1 };
        state.textPos = { x: 540, y: 820 };
        state.postmarkPos = { x: 800, y: 260 };
        state.badgePos = { x: 880, y: 180 };
        redraw();
    }

    function randomizeAll() {
        state.paperColor = paperColors[Math.floor(Math.random() * paperColors.length)].hex;
        state.borderColor = borderColors[Math.floor(Math.random() * borderColors.length)].hex;
        const rand = animals.filter(a => a.id !== 'upload')[Math.floor(Math.random() * (animals.length - 1))];
        state.animal = rand.id;
        state.customImg = null;
        resetPositions();
    }

    // 渲染引擎
    const canvas = document.getElementById('stampCanvas');
    const ctx = canvas.getContext('2d');

    function redraw() {
        ctx.clearRect(0, 0, 1080, 1080);
        
        // 1. 齿边背景
        ctx.save();
        ctx.fillStyle = state.borderColor;
        ctx.fillRect(80, 80, 920, 920);

        ctx.globalCompositeOperation = 'destination-out';
        const teeth = 14;
        const step = 920 / teeth;
        for (let i = 0; i < teeth; i++) {
            ctx.beginPath(); ctx.arc(80 + i * step + step/2, 80, 24, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(80 + i * step + step/2, 1000, 24, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(80, 80 + i * step + step/2, 24, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(1000, 80 + i * step + step/2, 24, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();

        // 2. 纸张内芯
        ctx.save();
        ctx.beginPath();
        ctx.rect(120, 120, 840, 840);
        ctx.clip();
        ctx.fillStyle = state.paperColor;
        ctx.fillRect(120, 120, 840, 840);
        ctx.restore();

        // 3. 动物/照片
        ctx.save();
        ctx.translate(state.animalPos.x, state.animalPos.y);
        ctx.scale(state.animalPos.scale, state.animalPos.scale);
        drawAnimal();
        ctx.restore();

        // 4. 复古邮戳
        ctx.save();
        ctx.translate(state.postmarkPos.x, state.postmarkPos.y);
        drawPostmark();
        ctx.restore();

        // 5. 趣味角标
        ctx.save();
        ctx.translate(state.badgePos.x, state.badgePos.y);
        drawBadge();
        ctx.restore();

        // 6. 手写文字
        ctx.save();
        ctx.translate(state.textPos.x, state.textPos.y);
        ctx.font = "bold 48px monospace";
        ctx.fillStyle = "#222";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(document.getElementById('stampText').value || state.text, 0, 0);
        ctx.restore();
    }

    function drawAnimal() {
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 10;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.fillStyle = "#fff";

        if (state.animal === 'upload' && state.customImg) {
            ctx.beginPath();
            ctx.arc(0, 0, 160, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(state.customImg, -160, -160, 320, 320);
            return;
        }

        ctx.beginPath();
        ctx.arc(0, 0, 130, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#222";
        ctx.beginPath(); ctx.arc(-35, -20, 12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(35, -20, 12, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 15, 10, 0, Math.PI*2); ctx.fill();
    }

    function drawPostmark() {
        ctx.strokeStyle = "rgba(180, 50, 50, 0.7)";
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 75, 0, Math.PI*2); ctx.stroke();
        
        ctx.fillStyle = "rgba(180, 50, 50, 0.8)";
        ctx.font = "bold 20px monospace";
        ctx.textAlign = "center";
        ctx.fillText("AIR MAIL · 2026", 0, -35);
        ctx.font = "bold 24px monospace";
        ctx.fillText("11.13", 0, 10);
    }

    function drawBadge() {
        const text = document.getElementById('badgeText').value || state.badgeText;
        ctx.fillStyle = "#ff758c";
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.roundRect(-90, -35, 180, 70, 20);
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 24px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 0, 0);
    }

    // 拖拽交互支持
    let dragging = false, activeItem = null, startX, startY;

    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * sx;
        const y = (e.clientY - rect.top) * sy;

        if (Math.hypot(x - state.postmarkPos.x, y - state.postmarkPos.y) < 90) {
            activeItem = 'postmark';
        } else if (Math.hypot(x - state.badgePos.x, y - state.badgePos.y) < 80) {
            activeItem = 'badge';
        } else if (Math.abs(y - state.textPos.y) < 50) {
            activeItem = 'text';
        } else {
            activeItem = 'animal';
        }
        dragging = true;
        startX = x; startY = y;
    });

    window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * sx;
        const y = (e.clientY - rect.top) * sy;
        const dx = x - startX, dy = y - startY;
        startX = x; startY = y;

        if (activeItem === 'animal') { state.animalPos.x += dx; state.animalPos.y += dy; }
        else if (activeItem === 'text') { state.textPos.x += dx; state.textPos.y += dy; }
        else if (activeItem === 'postmark') { state.postmarkPos.x += dx; state.postmarkPos.y += dy; }
        else if (activeItem === 'badge') { state.badgePos.x += dx; state.badgePos.y += dy; }
        redraw();
    });

    window.addEventListener('pointerup', () => { dragging = false; });

    function savePNG() {
        const link = document.createElement('a');
        link.download = 'my-cute-stamp.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    initUI();
    redraw();
</script>
</body>
    </html>
