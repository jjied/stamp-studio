                ctx.arc(24, -56, 7, 0, Math.PI * 2);
                ctx.fill();

                // 胡萝卜鼻子：只保留轮廓
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#231F20';
                ctx.beginPath();
                ctx.moveTo(0, -43);
                ctx.lineTo(39, -34);
                ctx.lineTo(0, -24);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 微笑
                ctx.beginPath();
                ctx.arc(0, -31, 17, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // 围巾：上移至下巴下方
ctx.fillStyle = '#FFFFFF';
ctx.strokeStyle = '#231F20';
ctx.lineWidth = 8;

// 围巾主体
ctx.beginPath();
ctx.moveTo(-58, 3);
ctx.quadraticCurveTo(0, 15, 58, 3);
ctx.lineTo(55, 23);
ctx.quadraticCurveTo(0, 35, -55, 23);
ctx.closePath();
ctx.fill();
ctx.stroke();

// 围巾垂下部分
ctx.beginPath();
ctx.moveTo(31, 17);
ctx.lineTo(46, 65);
ctx.lineTo(22, 60);
ctx.lineTo(13, 17);
ctx.closePath();
ctx.fill();
ctx.stroke();

                // 身体纽扣
                ctx.fillStyle = '#231F20';
                ctx.beginPath();
                ctx.arc(0, 49, 6, 0, Math.PI * 2);
                ctx.arc(0, 76, 6, 0, Math.PI * 2);
                ctx.fill();

                // 左腮红：粉色实心椭圆，独立绘制
                ctx.fillStyle = '#F9A8D4';
                ctx.beginPath();
                ctx.ellipse(-48, -35, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // 右腮红：与左侧完全一致
                ctx.beginPath();
                ctx.ellipse(48, -35, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        } // 结束 drawCharacterIllustration 函数

        function drawUploadedPhotoIllustration(ctx, img, applySketch) {
            const maxDim = 170;
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(-maxDim/2, -maxDim/2, maxDim, maxDim, 22);
            ctx.clip();

            if (applySketch) {
                const sketchCanvas = getSketchCanvas(img);
                ctx.drawImage(sketchCanvas, -maxDim/2, -maxDim/2, maxDim, maxDim);
            } else {
                ctx.drawImage(img, -maxDim/2, -maxDim/2, maxDim, maxDim);
            }
            ctx.restore();

            ctx.save();
            ctx.strokeStyle = '#231F20';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.roundRect(-maxDim/2 - 4, -maxDim/2 - 4, maxDim + 8, maxDim + 8, 26);
            ctx.stroke();
            ctx.restore();
        }

        function getSketchCanvas(img) {
            if (sketchCanvasCache && lastImgLoaded === img) return sketchCanvasCache;
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            try {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                    let v = avg < 140 ? avg * 0.65 : Math.min(255, avg * 1.35 + 15);
                    data[i] = v;
                    data[i + 1] = v;
                    data[i + 2] = v;
                }
                ctx.putImageData(imgData, 0, 0);
            } catch (e) {}
            sketchCanvasCache = canvas;
            lastImgLoaded = img;
            return canvas;
        }

        function drawPaperGrain(ctx, x, y, size) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.025)';
            for (let i = 0; i < 420; i++) {
                const gx = x + ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1 * size;
                const gy = y + ((Math.sin(i * 78.233) * 43758.5453) % 1 + 1) % 1 * size;
                ctx.fillRect(gx, gy, 2.5, 2.5);
            }
        }

        // ==========================================
        // 7. 图标缩略图渲染
        // ==========================================
       function getCharacterThumbnailSVG(id) {
    if (id === 'photo') {
        return `<svg viewBox="0 0 40 40" class="w-8 h-8"><rect x="7" y="9" width="26" height="22" rx="2" stroke="#f3f2f0" stroke-width="2.1" fill="none"/><circle cx="14" cy="16" r="2.5" stroke="#f3f2f0" stroke-width="2.1" fill="none"/><path d="M7 26 L14 19 L21 26 L27 21 L33 26" stroke="#f3f2f0" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    if (id === 'none') {
        return `<div class="w-8 h-8 flex items-center justify-center text-xs font-gaegu font-bold text-stone-300 border border-dashed border-white/25 rounded-lg">Aa</div>`;
    }

    return `<canvas data-character-thumbnail="${id}" width="80" height="80" class="w-8 h-8"></canvas>`;
}

// 缩略图直接使用正式角色的绘制逻辑
function renderCharacterThumbnails(container) {
    container.querySelectorAll('canvas[data-character-thumbnail]').forEach(canvas => {
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(0.18, 0.18);

        drawCharacterIllustration(
            ctx,
            canvas.dataset.characterThumbnail,
            '#f3f2f0'
        );

        ctx.restore();
    });
}
        // ==========================================
        // 8. 导出与复制
        // ==========================================
        function downloadStamp() {
            try {
                renderAllViews(true);
                const dataUrl = mainCanvas.toDataURL('image/png');
                renderAllViews(false);

                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 10);
                link.download = `my-cute-stamp-${timestamp}.png`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('高清 1080x1080 邮票已保存！✨');
            } catch (err) {
                console.error(err);
                showToast('保存失败，请重试');
            }
        }

        function copyStampToClipboard() {
            renderAllViews(true);
            mainCanvas.toBlob(async blob => {
                renderAllViews(false);
                if (!blob) return;
                try {
                    const item = new ClipboardItem({ 'image/png': blob });
                    await navigator.clipboard.write([item]);
                    showToast('邮票已复制到剪贴板！');
                } catch (e) {
                    downloadStamp();
                }
            });
        }

        function shareStamp() {
            renderAllViews(true);
            mainCanvas.toBlob(async blob => {
                renderAllViews(false);
                if (!blob) return;
                const file = new File([blob], 'cute-stamp.png', { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({ title: 'My Cute Stamp', text: '送你一张手绘治愈小邮票 ✨', files: [file] });
                        return;
                    } catch (e) {}
                }
                copyStampToClipboard();
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2600);
        }

        // ==========================================
        // 9. 安全启动
        // ==========================================
        let appInitialized = false;
        function safeBoot() {
            if (!appInitialized) {
                appInitialized = true;
                initApp();
            } else {
                renderAllViews();
            }
        }

        document.addEventListener('DOMContentLoaded', safeBoot);
        window.onload = function () {
            safeBoot();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => renderAllViews());
            }
        };
    </script>
