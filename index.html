<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MY STAMP GENERATOR - 手绘治愈系邮票生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Gaegu:wght@400;700&family=Indie+Flower&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        .font-gaegu { font-family: 'Gaegu', 'ZCOOL KuaiLe', 'Comic Sans MS', cursive; }
        .font-indie { font-family: 'Indie Flower', 'ZCOOL KuaiLe', 'Comic Sans MS', cursive; }
        .font-caveat { font-family: 'Caveat', 'Ma Shan Zheng', cursive; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        body {
            background-color: #141312;
            background-image: radial-gradient(circle at 50% 0%, #242220 0%, #141312 75%);
            color: #f3f2f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        .workbench-card {
            background: rgba(30, 28, 26, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
        }

        /* 严格锁定 1:1 正方形预览舞台 */
        .canvas-stage-wrapper {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            min-height: 290px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stampCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.75));
        }

        .grid-stamp-canvas {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
        }

        .ring-selected {
            box-shadow: 0 0 0 2px #1e1c1a, 0 0 0 4px #f5d0fe;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 15px;
            width: 15px;
            border-radius: 9999px;
            background: #f5d0fe;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
        }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: fixed;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 85vw;
                max-width: 680px;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-5 select-none">

    <!-- 主工作台容器 -->
    <div class="workbench-card w-full max-w-6xl rounded-3xl overflow-hidden flex flex-col">
        
        <!-- 页面顶部署名横幅 -->
        <div class="bg-gradient-to-r from-pink-500/10 via-amber-500/10 to-sky-500/10 px-4 py-2 border-b border-white/10 text-center text-xs sm:text-sm text-stone-300 font-medium tracking-wide">
            此网站由📕等一场雨季和Gemini共同制作
        </div>

        <!-- 顶部工具栏 -->
        <header class="px-3.5 sm:px-5 py-3 border-b border-white/10 flex items-center justify-between gap-2 bg-[#1a1817]/80">
            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="downloadStamp()" class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs sm:text-sm text-stone-100 transition active:scale-95 cursor-pointer" title="保存高分辨率 1080x1080 透明底 PNG">
                    <svg class="w-4 h-4 text-pink-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Save PNG</span>
                </button>
                <button onclick="copyStampToClipboard()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs sm:text-sm text-stone-200 transition active:scale-95 cursor-pointer" title="复制图片">
                    <svg class="w-4 h-4 text-emerald-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span class="hidden sm:inline">Copy</span>
                </button>
            </div>

            <h1 class="text-[11px] sm:text-sm md:text-base font-medium tracking-[0.16em] text-stone-100 uppercase text-center truncate">
                MY STAMP GENERATOR
            </h1>

            <div class="flex items-center gap-1.5 sm:gap-2">
                <button onclick="resetStamp()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs sm:text-sm text-stone-300 transition active:scale-95 cursor-pointer" title="重置默认">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    <span class="hidden sm:inline">Reset</span>
                </button>
                <button onclick="window.print()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 text-xs sm:text-sm text-stone-200 transition active:scale-95 cursor-pointer" title="打印">
                    <svg class="w-4 h-4 text-amber-200 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    <span class="hidden sm:inline">Print</span>
                </button>
            </div>
        </header>

        <!-- 主体内容区 -->
        <main class="flex-1 grid grid-cols-1 lg:grid-cols-12">
            
            <!-- 左侧：预览舞台 -->
            <section class="lg:col-span-6 p-4 sm:p-6 flex flex-col items-center justify-between bg-[#141312] border-b lg:border-b-0 lg:border-r border-white/10 relative">
                
                <!-- 顶部视图切换与提示 -->
                <div class="w-full flex flex-wrap justify-between items-center gap-2 text-[11px] text-stone-400 mb-2">
                    <div class="flex items-center gap-1 bg-white/5 p-1 rounded-xl border border-white/10">
                        <button onclick="setPreviewMode('single')" id="view-single" class="px-2.5 py-1 rounded-lg bg-white/15 text-white font-medium transition cursor-pointer flex items-center gap-1">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                            <span>单张 DIY 舞台</span>
                        </button>
                        <button onclick="setPreviewMode('grid')" id="view-grid" class="px-2.5 py-1 rounded-lg text-stone-400 hover:text-white transition cursor-pointer flex items-center gap-1">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            <span>四宫格灵感墙</span>
                        </button>
                    </div>

                    <div id="canvas-mode-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-stone-300">
                        <svg class="w-3 h-3 text-pink-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                        <span>1:1 正方形 (点击元素自由拖拽)</span>
                    </div>

                    <button onclick="resetElementPositions()" title="一键将拖乱的元素归位" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-pink-300/15 hover:bg-pink-300/25 border border-pink-300/30 text-pink-200 transition active:scale-95 cursor-pointer">
                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        <span>归位元素</span>
                    </button>
                </div>

                <!-- 邮票画布容器 (严格 1:1 正方形) -->
                <div id="print-area" class="my-auto py-2 flex flex-col items-center justify-center w-full">
                    <!-- 单张 DIY 画布 -->
                    <div id="single-preview-box" class="canvas-stage-wrapper">
                        <canvas id="stampCanvas" width="1080" height="1080" class="cursor-grab"></canvas>
                    </div>

                    <!-- 四宫格灵感墙 -->
                    <div id="grid-preview-box" class="hidden grid-cols-2 gap-3 w-full max-w-[360px] aspect-square min-h-[290px]">
                        <div class="bg-[#0d0c0c] rounded-2xl p-2 border border-white/10 flex items-center justify-center relative">
                            <canvas id="gridCanvas0" width="540" height="540" class="grid-stamp-canvas"></canvas>
                            <span class="absolute bottom-1.5 right-2 text-[9px] text-pink-200 bg-black/70 px-1.5 py-0.5 rounded">当前编辑</span>
                        </div>
                        <div onclick="applyGridPreset(1)" title="点击载入此样式" class="bg-[#0d0c0c] rounded-2xl p-2 border border-white/5 hover:border-pink-200/50 flex items-center justify-center cursor-pointer transition relative">
                            <canvas id="gridCanvas1" width="540" height="540" class="grid-stamp-canvas"></canvas>
                        </div>
                        <div onclick="applyGridPreset(2)" title="点击载入此样式" class="bg-[#0d0c0c] rounded-2xl p-2 border border-white/5 hover:border-pink-200/50 flex items-center justify-center cursor-pointer transition relative">
                            <canvas id="gridCanvas2" width="540" height="540" class="grid-stamp-canvas"></canvas>
                        </div>
                        <div onclick="applyGridPreset(3)" title="点击载入此样式" class="bg-[#0d0c0c] rounded-2xl p-2 border border-white/5 hover:border-pink-200/50 flex items-center justify-center cursor-pointer transition relative">
                            <canvas id="gridCanvas3" width="540" height="540" class="grid-stamp-canvas"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 底部快捷操作栏 -->
                <div class="w-full flex items-center justify-center gap-6 pt-3 text-xs text-stone-400">
                    <button onclick="downloadStamp()" class="flex flex-col items-center gap-1 hover:text-white transition cursor-pointer group">
                        <div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/10 transition">
                            <svg class="w-4 h-4 text-stone-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </div>
                        <span>Save PNG</span>
                    </button>
                    <button onclick="copyStampToClipboard()" class="flex flex-col items-center gap-1 hover:text-white transition cursor-pointer group">
                        <div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/10 transition">
                            <svg class="w-4 h-4 text-stone-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </div>
                        <span>Copy</span>
                    </button>
                    <button onclick="shareStamp()" class="flex flex-col items-center gap-1 hover:text-white transition cursor-pointer group">
                        <div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/10 transition">
                            <svg class="w-4 h-4 text-stone-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        </div>
                        <span>Share</span>
                    </button>
                    <button onclick="window.print()" class="flex flex-col items-center gap-1 hover:text-white transition cursor-pointer group">
                        <div class="p-2 rounded-xl bg-white/5 group-hover:bg-white/10 transition">
                            <svg class="w-4 h-4 text-stone-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        </div>
                        <span>Print</span>
                    </button>
                </div>
            </section>

            <!-- 右侧：DIY 控制面板 -->
            <section class="lg:col-span-6 p-4 sm:p-6 flex flex-col gap-3.5 bg-[#1e1c1a]/75 lg:max-h-[86vh] lg:overflow-y-auto no-scrollbar">
                
                <!-- 1. Paper Color & Pattern -->
                <div class="bg-black/25 p-3.5 rounded-2xl border border-white/5 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-medium tracking-wider text-stone-300 uppercase">Paper Color & Pattern</label>
                        <span id="paper-color-name" class="text-[11px] text-pink-200/90">樱花粉</span>
                    </div>
                    
                    <div id="color-swatches" class="flex items-center gap-2 flex-wrap"></div>

                    <!-- 底纹模式 -->
                    <div class="grid grid-cols-4 gap-1.5 pt-0.5">
                        <button onclick="setPattern('solid')" data-pattern="solid" class="pattern-btn py-1.5 px-2 rounded-xl text-xs bg-black/30 text-stone-400 border border-white/5 transition cursor-pointer">纯色 Solid</button>
                        <button onclick="setPattern('dots')" data-pattern="dots" class="pattern-btn py-1.5 px-2 rounded-xl text-xs bg-white/15 text-white border border-white/25 transition cursor-pointer">波点 Dots</button>
                        <button onclick="setPattern('v-stripes')" data-pattern="v-stripes" class="pattern-btn py-1.5 px-2 rounded-xl text-xs bg-black/30 text-stone-400 border border-white/5 transition cursor-pointer">竖条纹</button>
                        <button onclick="setPattern('d-stripes')" data-pattern="d-stripes" class="pattern-btn py-1.5 px-2 rounded-xl text-xs bg-black/30 text-stone-400 border border-white/5 transition cursor-pointer">斜条纹</button>
                    </div>

                    <!-- 底纹颜色与浓淡 -->
                    <div id="pattern-color-panel" class="pt-2 border-t border-white/10 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] text-stone-300">波点/条纹颜色</span>
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-stone-400">浓淡</span>
                                <input type="range" id="patternOpacitySlider" min="20" max="100" value="70" oninput="setPatternOpacity(this.value)" class="w-20">
                            </div>
                        </div>
                        <div id="pattern-swatches" class="flex items-center gap-1.5 flex-wrap"></div>
                    </div>
                </div>

                <!-- 2. Stamp Border Color -->
                <div class="bg-black/25 p-3.5 rounded-2xl border border-white/5 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-medium tracking-wider text-stone-300 uppercase">Stamp Border Color (齿边颜色)</label>
                        <span id="border-color-name" class="text-[11px] text-stone-300">纯白</span>
                    </div>
                    <div id="border-swatches" class="flex items-center gap-2 flex-wrap"></div>
                </div>

                <!-- 3. Add Character & Local Photo -->
                <div class="bg-black/25 p-3.5 rounded-2xl border border-white/5 space-y-2.5">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <label class="text-xs font-medium tracking-wider text-stone-300 uppercase">Character / Photo (小动物与照片)</label>
                        <div class="flex items-center gap-2">
                            <div class="flex items-center gap-1.5 text-[11px] text-stone-400">
                                <span>大小</span>
                                <input type="range" id="charScaleSlider" min="60" max="140" value="100" oninput="setCharScale(this.value)" class="w-16">
                            </div>
                            <div class="flex items-center gap-1 text-[11px] bg-black/40 p-0.5 rounded-lg border border-white/5">
                                <button onclick="setLayout('top')" id="layout-top" class="px-2 py-0.5 rounded bg-white/15 text-white transition cursor-pointer">居中</button>
                                <button onclick="setLayout('corner')" id="layout-corner" class="px-2 py-0.5 rounded text-stone-400 hover:text-white transition cursor-pointer">探头</button>
                                <button onclick="resetElementPositions()" class="px-1.5 py-0.5 rounded text-pink-200 hover:bg-white/10 transition cursor-pointer">归位</button>
                            </div>
                        </div>
                    </div>
                    <div id="character-list" class="grid grid-cols-5 gap-1.5 max-h-[168px] overflow-y-auto no-scrollbar pr-0.5"></div>
                    
                    <!-- 本地照片上传与滤镜 -->
                    <div class="pt-2 border-t border-white/10 flex items-center justify-between gap-2 flex-wrap">
                        <button onclick="document.getElementById('photoUploadInput').click()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 text-xs text-stone-200 cursor-pointer transition active:scale-95">
                            <svg class="w-4 h-4 text-pink-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <span>上传本地相册照片</span>
                            <input type="file" id="photoUploadInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                        </button>
                        <label class="flex items-center gap-1.5 text-xs text-stone-300 cursor-pointer select-none">
                            <input type="checkbox" id="sketchFilterCheckbox" checked onchange="toggleSketchFilter(this.checked)" class="rounded bg-black/40 border-white/20 text-pink-500 focus:ring-0 cursor-pointer w-4 h-4">
                            <span>手绘线稿滤镜</span>
                        </label>
                    </div>
                </div>

                <!-- 4. Enter Text -->
                <div class="bg-black/25 p-3.5 rounded-2xl border border-white/5 space-y-2.5">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <label for="stampText" class="text-xs font-medium tracking-wider text-stone-300 uppercase">Enter Text (核心治愈短句)</label>
                        <div class="flex items-center gap-2.5">
                            <div class="flex items-center gap-0.5 bg-black/40 p-0.5 rounded-lg border border-white/10">
                                <button onclick="setTextAlign('left')" data-talign="left" title="左对齐" class="talign-btn p-1 rounded text-stone-400 hover:text-white transition cursor-pointer">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                                </button>
                                <button onclick="setTextAlign('center')" data-talign="center" title="居中对齐" class="talign-btn p-1 rounded bg-white/15 text-white transition cursor-pointer">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
                                </button>
                                <button onclick="setTextAlign('right')" data-talign="right" title="右对齐" class="talign-btn p-1 rounded text-stone-400 hover:text-white transition cursor-pointer">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
                                </button>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <span class="text-[11px] text-stone-400">字号</span>
                                <input type="range" id="fontSizeSlider" min="60" max="140" value="100" oninput="setFontScale(this.value)" class="w-16">
                            </div>
                        </div>
                    </div>
                    <textarea id="stampText" rows="2" maxlength="65" placeholder="输入你的治愈短句..."
                        class="w-full bg-black/40 border border-white/10 focus:border-pink-300/60 focus:outline-none rounded-xl px-3.5 py-2 text-sm text-stone-100 placeholder-stone-600 resize-none transition"
                        oninput="updateText(this.value)">SWEET
DREAMS</textarea>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] text-stone-400">文字颜色</span>
                        <div id="text-colors" class="flex items-center gap-1.5"></div>
                    </div>

                    <div class="grid grid-cols-3 gap-2" id="font-selector">
                        <button onclick="setFont('Gaegu')" data-font="Gaegu" class="font-btn py-1.5 px-2 rounded-xl text-xs bg-white/15 text-white border border-white/25 font-gaegu transition cursor-pointer">呆萌手写体</button>
                        <button onclick="setFont('Indie Flower')" data-font="Indie Flower" class="font-btn py-1.5 px-2 rounded-xl text-xs bg-black/30 text-stone-400 hover:text-white border border-white/5 font-indie transition cursor-pointer">随笔涂鸦体</button>

        // ==========================================

        // ==========================================
        function setPreviewMode(mode) { state.previewMode = mode; state.selectedElement = null; syncUIState(); renderAllViews(); }
        function setPaperColor(hex) { state.paperColor = hex; syncUIState(); renderAllViews(); }
        function setPattern(pat) { state.pattern = pat; syncUIState(); renderAllViews(); }
        function setPatternColor(hex) { state.patternColor = hex; syncUIState(); renderAllViews(); }
        function setPatternOpacity(val) { state.patternOpacity = Number(val); renderAllViews(); }
        function setBorderColor(hex) { state.borderColor = hex; syncUIState(); renderAllViews(); }

        function setCharacter(id) {
            state.character = id;
            if (id === 'photo' && !state.uploadedImageObj) {
                document.getElementById('photoUploadInput').click();
                return;
            }
            if (id !== 'none') state.selectedElement = { type: 'character' };
            else if (state.selectedElement && state.selectedElement.type === 'character') state.selectedElement = null;
            syncUIState();
            renderAllViews();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    state.uploadedImageObj = img;
                    state.character = 'photo';
                    state.selectedElement = { type: 'character' };
                    sketchCanvasCache = null;
                    syncUIState();
                    renderAllViews();
                    showToast('本地相册照片上传成功！✨');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function toggleSketchFilter(val) {
            state.sketchFilter = val;
            renderAllViews();
        }

        function setCharScale(val) { state.charScale = Number(val); renderAllViews(); }

        function setLayout(layout) {
            state.layout = layout;
            resetElementPositions(false);
            syncUIState();
            renderAllViews();
        }

        function resetElementPositions(notify = true) {
            if (state.character === 'none') {
                state.textX = 540;
                state.textY = 540;
            } else if (state.layout === 'top') {
                state.charX = 540;
                state.charY = 420;
                state.textX = 540;
                state.textY = 710;
            } else {
                state.charX = 745;
                state.charY = 735;
                state.textX = 335;
                state.textY = 345;
            }
            state.charRotation = 0;
            state.textRotation = 0;
            state.postmark.x = 245;
            state.postmark.y = 235;
            state.postmark.rotation = -0.16;
            state.badge.x = 825;
            state.badge.y = 205;
            state.badge.rotation = 0;
            state.snapGuides = { x: false, y: false };
            renderAllViews();
            if (notify) showToast('已将所有元素归位 ✨');
        }

        function togglePostmark() {
            state.postmark.enabled = !state.postmark.enabled;
            if (!state.postmark.enabled && state.selectedElement?.type === 'postmark') state.selectedElement = null;
            else if (state.postmark.enabled) state.selectedElement = { type: 'postmark' };
            syncUIState();
            renderAllViews();
        }

        function setPostmarkStyle(style) {
            state.postmark.enabled = true;
            state.postmark.style = style;
            syncUIState();
            renderAllViews();
        }

        function updatePostmarkField(field, val) {
            state.postmark.enabled = true;
            state.postmark[field] = val;
            syncUIState();
            renderAllViews();
        }

        function toggleBadge() {
            state.badge.enabled = !state.badge.enabled;
            if (!state.badge.enabled && state.selectedElement?.type === 'badge') state.selectedElement = null;
            else if (state.badge.enabled) state.selectedElement = { type: 'badge' };
            syncUIState();
            renderAllViews();
        }

        function applyBadgePreset(txt) {
            state.badge.enabled = true;
            state.badge.text = txt;
            state.selectedElement = { type: 'badge' };
            syncUIState();
            renderAllViews();
        }

        function setBadgeFrame(frame) {
            state.badge.enabled = true;
            state.badge.frame = frame;
            syncUIState();
            renderAllViews();
        }

        function updateBadgeField(field, val) {
            state.badge.enabled = true;
            state.badge[field] = val;
            syncUIState();
            renderAllViews();
        }

        function snapBadgeCorner(corner) {
            state.badge.enabled = true;
            const map = {
                tl: { x: 255, y: 205 },
                tr: { x: 825, y: 205 },
                bl: { x: 255, y: 880 },
                br: { x: 825, y: 880 }
            };
            if (map[corner]) {
                state.badge.x = map[corner].x;
                state.badge.y = map[corner].y;
                state.badge.rotation = 0;
            }
            state.selectedElement = { type: 'badge' };
            syncUIState();
            renderAllViews();
        }

        function setDiyTool(tool) {
            state.diyTool = tool;
            if (tool === 'draw') state.selectedElement = null;
            syncUIState();
            renderAllViews();
        }

        function addSticker(id) {

        // ==========================================
        // 4. 画布全元素拖拽 & 缩放 & 旋转交互
        // ==========================================
        function getCanvasCoords(clientX, clientY) {
            const rect = mainCanvas.getBoundingClientRect();
            const w = rect.width || 340;
            const h = rect.height || 340;
            return {
                x: (clientX - rect.left) * (mainCanvas.width / w),
                y: (clientY - rect.top) * (mainCanvas.height / h)
            };
        }

        function getElementBounds(cfg, target) {
            if (!target) return null;
            if (target.type === 'postmark') {
                if (!cfg.postmark || !cfg.postmark.enabled) return null;
                const s = cfg.postmark.scale || 1;
                return { cx: cfg.postmark.x, cy: cfg.postmark.y, halfW: 155 * s, halfH: 96 * s, rotation: cfg.postmark.rotation || 0, canDelete: true };
            }
            if (target.type === 'badge') {
                if (!cfg.badge || !cfg.badge.enabled) return null;
                const s = cfg.badge.scale || 1;
                const txtLen = Math.max(4, (cfg.badge.text || '').length);
                const w = Math.max(85, txtLen * 16 + 38) * s;
                return { cx: cfg.badge.x, cy: cfg.badge.y, halfW: w, halfH: 42 * s, rotation: cfg.badge.rotation || 0, canDelete: true };
            }
            if (target.type === 'sticker') {
                const st = cfg.stickers[target.index];
                if (!st) return null;
                const half = 46 * st.scale;
                return { cx: st.x, cy: st.y, halfW: half, halfH: half, rotation: st.rotation || 0, canDelete: true };
            }
            if (target.type === 'character') {
                if (cfg.character === 'none') return null;
                const factor = ((cfg.charScale || 100) / 100) * 1.15;
                const isPhoto = (cfg.character === 'photo');
                return { cx: cfg.charX, cy: cfg.charY, halfW: (isPhoto ? 100 : 145) * factor, halfH: (isPhoto ? 100 : 125) * factor, rotation: cfg.charRotation || 0, canDelete: false };
            }
            if (target.type === 'text') {
                const lines = (cfg.text || '').split('\n').filter(l => l.trim() !== '');
                if (lines.length === 0) return null;
                const fontScaleFactor = (cfg.fontScale || 100) / 100;
                const baseFont = (cfg.character === 'none' ? 110 : 84) * fontScaleFactor;
                const maxLen = Math.max(...lines.map(l => l.length));
                let fontSize = baseFont;
                if (maxLen > 12) fontSize *= 0.82;
                if (lines.length >= 4) fontSize *= 0.85;

                let maxLineUnits = 0;
                lines.forEach(line => {
                    let units = 0;
                    for (const ch of line) units += /[\u4e00-\u9fa5]/.test(ch) ? 1.05 : 0.58;
                    if (units > maxLineUnits) maxLineUnits = units;
                });

                const lineHeight = fontSize * 1.14;
                return {
                    cx: cfg.textX,
                    cy: cfg.textY,
                    halfW: Math.max(90, (maxLineUnits * fontSize) / 2 + 28),
                    halfH: Math.max(48, (lines.length * lineHeight) / 2 + 20),
                    rotation: cfg.textRotation || 0,
                    canDelete: false
                };
            }
            return null;
        }

        function toLocalPoint(pt, bounds) {
            const dx = pt.x - bounds.cx;
            const dy = pt.y - bounds.cy;
            const cos = Math.cos(-bounds.rotation);
            const sin = Math.sin(-bounds.rotation);
            return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
        }

        function toWorldPoint(lx, ly, bounds) {
            const cos = Math.cos(bounds.rotation);
            const sin = Math.sin(bounds.rotation);
            return { x: bounds.cx + lx * cos - ly * sin, y: bounds.cy + lx * sin + ly * cos };
        }

        function handleCanvasDown(clientX, clientY) {
            if (state.previewMode !== 'single') return;
            const pt = getCanvasCoords(clientX, clientY);

            if (state.diyTool === 'draw') {
                interactionState.isPointerDown = true;
                interactionState.action = 'draw-stroke';
                interactionState.currentStroke = { color: state.brushColor, size: state.brushSize, points: [pt] };
                state.brushStrokes.push(interactionState.currentStroke);
                renderAllViews();
                return;
            }

            if (state.selectedElement) {
                const bounds = getElementBounds(state, state.selectedElement);
                if (bounds) {
                    const rotHandle = toWorldPoint(-bounds.halfW, -bounds.halfH, bounds);
                    if (Math.hypot(pt.x - rotHandle.x, pt.y - rotHandle.y) <= 34) {
                        interactionState.isPointerDown = true;
                        interactionState.action = 'rotate-element';
                        interactionState.target = { ...state.selectedElement };
                        interactionState.initialRotation = bounds.rotation;
                        interactionState.initialAngle = Math.atan2(pt.y - bounds.cy, pt.x - bounds.cx);
                        return;
                    }
                    if (bounds.canDelete) {
                        const delHandle = toWorldPoint(bounds.halfW, -bounds.halfH, bounds);
                        if (Math.hypot(pt.x - delHandle.x, pt.y - delHandle.y) <= 34) {
                            if (state.selectedElement.type === 'sticker') {
                                state.stickers.splice(state.selectedElement.index, 1);
                            } else if (state.selectedElement.type === 'postmark') {
                                state.postmark.enabled = false;
                                syncUIState();
                            } else if (state.selectedElement.type === 'badge') {
                                state.badge.enabled = false;
                                syncUIState();
                            }
                            state.selectedElement = null;
                            renderAllViews();
                            return;
                        }
                    }
                    const sclHandle = toWorldPoint(bounds.halfW, bounds.halfH, bounds);
                    if (Math.hypot(pt.x - sclHandle.x, pt.y - sclHandle.y) <= 34) {
                        interactionState.isPointerDown = true;
                        interactionState.action = 'scale-element';
                        interactionState.target = { ...state.selectedElement };
                        interactionState.initialDist = Math.max(24, Math.hypot(pt.x - bounds.cx, pt.y - bounds.cy));
                        if (state.selectedElement.type === 'sticker') interactionState.initialScale = state.stickers[state.selectedElement.index].scale;
                        else if (state.selectedElement.type === 'postmark') interactionState.initialScale = state.postmark.scale;
                        else if (state.selectedElement.type === 'badge') interactionState.initialScale = state.badge.scale;
                        else if (state.selectedElement.type === 'character') interactionState.initialScale = state.charScale;
                        else if (state.selectedElement.type === 'text') interactionState.initialScale = state.fontScale;
                        return;
                    }
                }
            }

            let hitTarget = null;
            if (!hitTarget && state.badge && state.badge.enabled) {
                const bb = getElementBounds(state, { type: 'badge' });
                if (bb) {
                    const local = toLocalPoint(pt, bb);
                    if (Math.abs(local.x) <= bb.halfW + 10 && Math.abs(local.y) <= bb.halfH + 10) hitTarget = { type: 'badge' };
                }
            }
            if (!hitTarget && state.postmark && state.postmark.enabled) {
                const pb = getElementBounds(state, { type: 'postmark' });
                if (pb) {
                    const local = toLocalPoint(pt, pb);
                    if (Math.abs(local.x) <= pb.halfW + 10 && Math.abs(local.y) <= pb.halfH + 10) hitTarget = { type: 'postmark' };
                }
            }
            if (!hitTarget) {
                for (let i = state.stickers.length - 1; i >= 0; i--) {
                    const b = getElementBounds(state, { type: 'sticker', index: i });
                    if (b) {
                        const local = toLocalPoint(pt, b);
                        if (Math.abs(local.x) <= b.halfW + 12 && Math.abs(local.y) <= b.halfH + 12) {
                            hitTarget = { type: 'sticker', index: i };
                            break;
                        }
                    }
                }
            }
            if (!hitTarget) {
                const tb = getElementBounds(state, { type: 'text' });
                if (tb) {
                    const local = toLocalPoint(pt, tb);
                    if (Math.abs(local.x) <= tb.halfW && Math.abs(local.y) <= tb.halfH) hitTarget = { type: 'text' };
                }
            }
            if (!hitTarget) {
                const cb = getElementBounds(state, { type: 'character' });
                if (cb) {
                    const local = toLocalPoint(pt, cb);
                    if (Math.abs(local.x) <= cb.halfW && Math.abs(local.y) <= cb.halfH) hitTarget = { type: 'character' };
                }
            }

            if (hitTarget) {
                state.selectedElement = hitTarget;
                interactionState.isPointerDown = true;
                interactionState.action = 'drag-element';
                interactionState.target = { ...hitTarget };
                if (hitTarget.type === 'sticker') {
                    interactionState.dragOffsetX = pt.x - state.stickers[hitTarget.index].x;
                    interactionState.dragOffsetY = pt.y - state.stickers[hitTarget.index].y;
                } else if (hitTarget.type === 'postmark') {
                    interactionState.dragOffsetX = pt.x - state.postmark.x;
                    interactionState.dragOffsetY = pt.y - state.postmark.y;
                } else if (hitTarget.type === 'badge') {
                    interactionState.dragOffsetX = pt.x - state.badge.x;
                    interactionState.dragOffsetY = pt.y - state.badge.y;
                } else if (hitTarget.type === 'character') {
                    interactionState.dragOffsetX = pt.x - state.charX;
                    interactionState.dragOffsetY = pt.y - state.charY;
                } else if (hitTarget.type === 'text') {
                    interactionState.dragOffsetX = pt.x - state.textX;
                    interactionState.dragOffsetY = pt.y - state.textY;
                }
                mainCanvas.style.cursor = 'grabbing';
            } else {
                state.selectedElement = null;
            }
            renderAllViews();
        }

        function handleCanvasMove(clientX, clientY) {
            if (!interactionState.isPointerDown) return;
            const pt = getCanvasCoords(clientX, clientY);

            if (interactionState.action === 'draw-stroke' && interactionState.currentStroke) {
                interactionState.currentStroke.points.push(pt);
                renderAllViews();
                return;
            }

            const target = interactionState.target;
            if (!target) return;

            if (interactionState.action === 'drag-element') {
                const minB = target.type === 'postmark' ? 75 : 135;
                const maxB = target.type === 'postmark' ? 1005 : 945;
                let nx = Math.max(minB, Math.min(maxB, pt.x - interactionState.dragOffsetX));
                let ny = Math.max(minB, Math.min(maxB, pt.y - interactionState.dragOffsetY));
                let snapX = false, snapY = false;
                if (Math.abs(nx - 540) < 14) { nx = 540; snapX = true; }
                if (Math.abs(ny - 540) < 14) { ny = 540; snapY = true; }
                state.snapGuides = { x: snapX, y: snapY };

                if (target.type === 'sticker' && state.stickers[target.index]) {
                    state.stickers[target.index].x = nx;
                    state.stickers[target.index].y = ny;
                } else if (target.type === 'postmark') {
                    state.postmark.x = nx;
                    state.postmark.y = ny;
                } else if (target.type === 'badge') {
                    state.badge.x = nx;
                    state.badge.y = ny;
                } else if (target.type === 'character') {
                    state.charX = nx;
                    state.charY = ny;
                } else if (target.type === 'text') {
                    state.textX = nx;
                    state.textY = ny;
                }
                renderAllViews();
            } else if (interactionState.action === 'scale-element') {
                const bounds = getElementBounds(state, target);
                if (!bounds) return;
                const currDist = Math.max(20, Math.hypot(pt.x - bounds.cx, pt.y - bounds.cy));
                const ratio = currDist / interactionState.initialDist;
                if (target.type === 'sticker' && state.stickers[target.index]) {
                    state.stickers[target.index].scale = Math.max(0.45, Math.min(2.4, interactionState.initialScale * ratio));
                } else if (target.type === 'postmark') {
                    state.postmark.scale = Math.max(0.5, Math.min(1.8, interactionState.initialScale * ratio));
                } else if (target.type === 'badge') {
                    state.badge.scale = Math.max(0.55, Math.min(1.9, interactionState.initialScale * ratio));
                } else if (target.type === 'character') {
                    state.charScale = Math.round(Math.max(45, Math.min(180, interactionState.initialScale * ratio)));
                    document.getElementById('charScaleSlider').value = Math.min(140, Math.max(60, state.charScale));
                } else if (target.type === 'text') {
                    state.fontScale = Math.round(Math.max(45, Math.min(180, interactionState.initialScale * ratio)));
                    document.getElementById('fontSizeSlider').value = Math.min(140, Math.max(60, state.fontScale));
                }
                renderAllViews();
            } else if (interactionState.action === 'rotate-element') {
                const bounds = getElementBounds(state, target);
                if (!bounds) return;
                const currAngle = Math.atan2(pt.y - bounds.cy, pt.x - bounds.cx);
                let newRot = interactionState.initialRotation + (currAngle - interactionState.initialAngle);
                if (Math.abs(newRot) < 0.06) newRot = 0;
                if (target.type === 'sticker' && state.stickers[target.index]) state.stickers[target.index].rotation = newRot;
                else if (target.type === 'postmark') state.postmark.rotation = newRot;
                else if (target.type === 'badge') state.badge.rotation = newRot;
                else if (target.type === 'character') state.charRotation = newRot;
                else if (target.type === 'text') state.textRotation = newRot;
                renderAllViews();
            }
        }

        function handleCanvasUp() {
            if (interactionState.isPointerDown) {
                interactionState.isPointerDown = false;
                interactionState.action = null;
                interactionState.target = null;
                interactionState.currentStroke = null;
                state.snapGuides = { x: false, y: false };
                if (state.diyTool === 'sticker') mainCanvas.style.cursor = 'grab';
                renderAllViews();
            }
        }

        function bindCanvasInteractions() {
            mainCanvas.addEventListener('mousedown', (e) => handleCanvasDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => handleCanvasMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', handleCanvasUp);

            mainCanvas.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    e.preventDefault();
                    handleCanvasDown(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            mainCanvas.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0 && interactionState.isPointerDown) {
                    e.preventDefault();
                    handleCanvasMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            mainCanvas.addEventListener('touchend', handleCanvasUp);
            mainCanvas.addEventListener('touchcancel', handleCanvasUp);
    }

        // ==========================================

        function renderAllViews(isExporting = false) {

                        charY: isCorner ? 735 : 420,

                        text: p.text,

                        textColor: '#231F20',

                        textRotation: 0,

                        fontScale: p.scale,

                        postmark: p.postmark,
                        badge: p.badge,
                        selectedElement: null,
                        snapGuides: { x: false, y: false },

                    }, true);
                }
            }
        }


// ==========================================
// 邮票真实齿边轮廓
// ==========================================
function tracePerforatedStampPath(ctx, x, y, w, h) {
    const notches = 13;   // 每条边的齿孔数量
    const depth = 20;     // 齿孔凹陷深度
    const corner = 34;    // 四角留白

    function drawEdge(sx, sy, ex, ey, nx, ny) {
        const dx = ex - sx;
        const dy = ey - sy;
        const length = Math.hypot(dx, dy);
        const step = length / (notches + 1);
        const notchWidth = step * 0.72;

        for (let i = 1; i <= notches; i++) {
            const center = step * i;
            const start = center - notchWidth / 2;
            const end = center + notchWidth / 2;

            ctx.lineTo(
                sx + dx * start / length,
                sy + dy * start / length
            );

            ctx.quadraticCurveTo(
                sx + dx * center / length + nx * depth * 2,
                sy + dy * center / length + ny * depth * 2,
                sx + dx * end / length,
                sy + dy * end / length
            );
        }

        ctx.lineTo(ex, ey);
    }

    ctx.beginPath();
    ctx.moveTo(x + corner, y);

    // 上边：向内凹
    drawEdge(x + corner, y, x + w - corner, y, 0, 1);

    // 右边：向内凹
    ctx.lineTo(x + w, y + corner);
    drawEdge(x + w, y + corner, x + w, y + h - corner, -1, 0);

    // 下边：向内凹
    ctx.lineTo(x + w - corner, y + h);
    drawEdge(x + w - corner, y + h, x + corner, y + h, 0, -1);

    // 左边：向内凹
    ctx.lineTo(x, y + h - corner);
    drawEdge(x, y + h - corner, x, y + corner, 1, 0);

    ctx.closePath();
}
        
        function renderStampToCanvas(targetCanvas, ctx, cfg, isExporting = false) {
            const W = targetCanvas.width;
            const scaleRatio = W / 1080;

            ctx.save();
            ctx.clearRect(0, 0, W, W);
            ctx.scale(scaleRatio, scaleRatio);

            const baseSize = 1080;
            const margin = 65;
            const stampSize = baseSize - margin * 2;
            const innerPad = 48;

            // 1. 真正的邮票锯齿边框
            ctx.fillStyle = cfg.borderColor || '#FFFFFF';
            tracePerforatedStampPath(
                ctx,
                margin,
                margin,
                stampSize,
                stampSize
            );
            ctx.fill();

            // 2. 内部纸张底色与底纹
            const innerX = margin + innerPad;
            const innerY = margin + innerPad;
            const innerSize = stampSize - innerPad * 2;

            ctx.save();
            ctx.fillStyle = cfg.paperColor;
            ctx.fillRect(innerX, innerY, innerSize, innerSize);

            drawPaperPattern(ctx, innerX, innerY, innerSize, cfg.pattern, cfg.patternColor, cfg.patternOpacity);

            ctx.beginPath();
            ctx.rect(innerX, innerY, innerSize, innerSize);
            ctx.clip();

            // 3. 小动物/照片
            const fontScaleFactor = (cfg.fontScale || 100) / 100;
            const charScaleFactor = (cfg.charScale || 100) / 100;

            if (cfg.character !== 'none') {
                ctx.save();
                ctx.translate(cfg.charX ?? 540, cfg.charY ?? 420);
                ctx.rotate(cfg.charRotation || 0);
                ctx.scale(1.15 * charScaleFactor, 1.15 * charScaleFactor);
                if (cfg.character === 'photo' && cfg.uploadedImageObj) {
                    drawUploadedPhotoIllustration(ctx, cfg.uploadedImageObj, cfg.sketchFilter);
                } else if (cfg.character !== 'photo') {
                    drawCharacterIllustration(ctx, cfg.character);
                }
                ctx.restore();
            }

            // 4. 文字
            const textBaseSize = (cfg.character === 'none' ? 110 : 84) * fontScaleFactor;
            drawHandwrittenText(ctx, cfg.text, cfg.textX ?? 540, cfg.textY ?? 710, textBaseSize, cfg);

            // 5. 手绘涂鸦
            drawFreehandStrokes(ctx, cfg.brushStrokes);

            // 6. 贴纸
            drawInteractiveStickers(ctx, cfg.stickers);

            // 7. 面值角标
            if (cfg.badge && cfg.badge.enabled) {
                drawDenominationBadge(ctx, cfg.badge);
            }

            // 8. 纸张噪点
            drawPaperGrain(ctx, innerX, innerY, innerSize);
            ctx.restore();

            // 9. 复古邮戳
            if (cfg.postmark && cfg.postmark.enabled) {
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(margin, margin, stampSize, stampSize, 8);
                ctx.clip();
                drawVintagePostmark(ctx, cfg.postmark);
                ctx.restore();
            }

            // 10. 编辑 gizmos
            if (!isExporting) {
                if (cfg.snapGuides && (cfg.snapGuides.x || cfg.snapGuides.y)) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(244, 63, 94, 0.55)';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([10, 8]);
                    if (cfg.snapGuides.x) {
                        ctx.beginPath(); ctx.moveTo(540, innerY); ctx.lineTo(540, innerY + innerSize); ctx.stroke();
                    }
                    if (cfg.snapGuides.y) {
                        ctx.beginPath(); ctx.moveTo(innerX, 540); ctx.lineTo(innerX + innerSize, 540); ctx.stroke();
                    }
                    ctx.restore();
                }

                if (cfg.selectedElement) {
                    const bounds = getElementBounds(cfg, cfg.selectedElement);
                    if (bounds) drawSelectionGizmo(ctx, bounds);
                }
            }

            ctx.restore();
        }

        function cutStampPerforations(ctx, x, y, w, h) {
            const notches = 13;
            const step = w / notches;
            const holeRadius = step * 0.27;

            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = '#000000';

            for (let i = 0; i <= notches; i++) {
                const pos = i * step;
                ctx.beginPath(); ctx.arc(x + pos, y, holeRadius, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + pos, y + h, holeRadius, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x, y + pos, holeRadius, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + w, y + pos, holeRadius, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function drawVintagePostmark(ctx, pm) {
            ctx.save();
            ctx.translate(pm.x, pm.y);
            ctx.rotate(pm.rotation || 0);
            ctx.scale(pm.scale || 1, pm.scale || 1);

            ctx.globalAlpha = Math.max(0.15, Math.min(1, (pm.opacity ?? 78) / 100));
            ctx.strokeStyle = pm.color || '#231F20';
            ctx.fillStyle = pm.color || '#231F20';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const cx = -42;

            if (pm.style === 'heart') {
                ctx.lineWidth = 4.5;
                drawSketchHeart(ctx, cx, 0, 74);
                ctx.lineWidth = 2.5;
                drawSketchHeart(ctx, cx, 0, 58);

                ctx.lineWidth = 3.6;
                for (let row = -1; row <= 1; row++) {
                    const wy = row * 24;
                    ctx.beginPath();
                    for (let wx = 44; wx <= 156; wx += 4) {
                        const offset = Math.sin((wx - 44) * 0.13) * 6.5;
                        if (wx === 44) ctx.moveTo(wx, wy + offset);
                        else ctx.lineTo(wx, wy + offset);
                    }
                    ctx.stroke();
                }
                drawSketchHeart(ctx, 100, -40, 12);
                drawSketchHeart(ctx, 128, 42, 10);
            } else if (pm.style === 'star') {
                ctx.lineWidth = 4.5;
                ctx.beginPath(); ctx.arc(cx, 0, 76, 0, Math.PI * 2); ctx.stroke();
                ctx.lineWidth = 2.4;
                ctx.setLineDash([7, 5]);
                ctx.beginPath(); ctx.arc(cx, 0, 62, 0, Math.PI * 2); ctx.stroke();
                ctx.setLineDash([]);

                drawMiniStar(ctx, cx - 52, 0, 7);
                drawMiniStar(ctx, cx + 52, 0, 7);

                ctx.lineWidth = 3.5;
                for (let row = -1.5; row <= 1.5; row += 1) {
                    const wy = row * 19;
                    ctx.beginPath();
                    for (let wx = 42; wx <= 158; wx += 4) {
                        const offset = Math.sin((wx - 42) * 0.14) * 6;
                        if (wx === 42) ctx.moveTo(wx, wy + offset);
                        else ctx.lineTo(wx, wy + offset);
                    }
                    ctx.stroke();
                }
            } else {
                ctx.lineWidth = 4.5;
                ctx.beginPath(); ctx.arc(cx, 0, 76, 0, Math.PI * 2); ctx.stroke();
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(cx, 0, 56, 0, Math.PI * 2); ctx.stroke();

                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(cx - 53, -15); ctx.lineTo(cx + 53, -15);
                ctx.moveTo(cx - 53, 15); ctx.lineTo(cx + 53, 15);
                ctx.stroke();

                ctx.lineWidth = 3.8;
                for (let row = -1.5; row <= 1.5; row += 1) {
                    const wy = row * 20;
                    ctx.beginPath();
                    for (let wx = 42; wx <= 158; wx += 4) {
                        const offset = Math.sin((wx - 42) * 0.13) * 7;
                        if (wx === 42) ctx.moveTo(wx, wy + offset);
                        else ctx.lineTo(wx, wy + offset);
                    }
                    ctx.stroke();
                }
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '700 18px "Gaegu", "ZCOOL KuaiLe", cursive';
            if (pm.topText) ctx.fillText(pm.topText.toUpperCase(), cx, -36);
            if (pm.bottomText) ctx.fillText(pm.bottomText.toUpperCase(), cx, 36);

            ctx.font = '700 22px "Gaegu", "Courier New", monospace';
            if (pm.dateText) ctx.fillText(pm.dateText, cx, 1);

            ctx.restore();
        }

        function drawSketchHeart(ctx, x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y + r * 0.78);
            ctx.bezierCurveTo(x - r * 1.15, y + r * 0.05, x - r * 0.85, y - r * 0.82, x, y - r * 0.28);
            ctx.bezierCurveTo(x + r * 0.85, y - r * 0.82, x + r * 1.15, y + r * 0.05, x, y + r * 0.78);
            ctx.stroke();
        }

        function drawMiniStar(ctx, x, y, r) {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
                const a2 = a1 + Math.PI / 5;
                if (i === 0) ctx.moveTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
                else ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
                ctx.lineTo(x + Math.cos(a2) * (r * 0.45), y + Math.sin(a2) * (r * 0.45));
            }
            ctx.closePath();
            ctx.fill();
        }

        function drawDenominationBadge(ctx, badge) {
            const text = (badge.text || '').trim();
            if (!text) return;

            ctx.save();
            ctx.translate(badge.x, badge.y);
            ctx.rotate(badge.rotation || 0);
            ctx.scale(badge.scale || 1, badge.scale || 1);

            const color = badge.color || '#231F20';
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.font = '700 34px "Gaegu", "ZCOOL KuaiLe", "Comic Sans MS", cursive';
            const metrics = ctx.measureText(text);
            const boxW = Math.max(96, metrics.width + 36);
            const boxH = 54;

            if (badge.frame === 'box') {
                ctx.lineWidth = 4.2;
                ctx.beginPath();
                ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 10);
                ctx.stroke();

                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.roundRect(-boxW / 2 + 5, -boxH / 2 + 5, boxW - 10, boxH - 10, 7);
                ctx.stroke();
            } else if (badge.frame === 'oval') {
                ctx.lineWidth = 4.2;
                ctx.beginPath();
                ctx.ellipse(0, 0, boxW * 0.56, boxH * 0.58, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 0, 2);

            ctx.restore();
        }

        function drawPaperPattern(ctx, x, y, size, pattern, colorHex, opacityPercent) {
            if (!pattern || pattern === 'solid') return;
            ctx.save();
            ctx.globalAlpha = Math.max(0.1, Math.min(1, (opacityPercent || 70) / 100));

            if (pattern === 'dots') {
                ctx.fillStyle = colorHex || '#FFFFFF';
                const spacing = 42;
                let row = 0;
                for (let py = y + 20; py < y + size; py += spacing) {
                    const offsetX = (row % 2 === 1) ? spacing / 2 : 0;
                    for (let px = x + 20 + offsetX; px < x + size; px += spacing) {
                        ctx.beginPath();
                        ctx.arc(px, py, 6.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    row++;
                }
            } else if (pattern === 'v-stripes') {
                ctx.fillStyle = colorHex || '#FFFFFF';
                const stripeW = 22;
                const gap = 46;
                for (let px = x + 14; px < x + size; px += gap) {
                    ctx.fillRect(px, y, stripeW, size);
                }
            } else if (pattern === 'd-stripes') {
                ctx.strokeStyle = colorHex || '#FFFFFF';
                ctx.lineWidth = 18;
                const step = 54;
                for (let d = -size; d < size * 2; d += step) {
                    ctx.beginPath();
                    ctx.moveTo(x + d, y);
                    ctx.lineTo(x + d - size, y + size);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function drawHandwrittenText(ctx, text, x, y, baseSize, cfg) {
            const lines = (text || '').split('\n').filter(l => l.trim() !== '');
            if (lines.length === 0) return;

            const maxLen = Math.max(...lines.map(l => l.length));
            let fontSize = baseSize;
            if (maxLen > 12) fontSize *= 0.82;
            if (lines.length >= 4) fontSize *= 0.85;

            const zhFallback = cfg.fontFamily === 'Caveat' ? '"Ma Shan Zheng"' : '"ZCOOL KuaiLe"';
            ctx.font = `700 ${Math.round(fontSize)}px "${cfg.fontFamily}", ${zhFallback}, "Comic Sans MS", cursive`;
            const lineHeight = fontSize * 1.14;
            const align = cfg.textAlign || 'center';

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(cfg.textRotation || 0);
            ctx.fillStyle = cfg.textColor || '#231F20';
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';

            const bounds = getElementBounds(cfg, { type: 'text' });
            const halfW = bounds ? bounds.halfW - 22 : 0;
            const anchorX = align === 'left' ? -halfW : (align === 'right' ? halfW : 0);
            const startY = -((lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, index) => {
                const jitterX = Math.sin(index * 2.5) * 2.2;
                ctx.fillText(line, anchorX + jitterX, startY + index * lineHeight);
            });
            ctx.restore();
        }

        function drawFreehandStrokes(ctx, strokes) {
            if (!strokes || strokes.length === 0) return;
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            strokes.forEach(stroke => {
                if (!stroke.points || stroke.points.length === 0) return;
                ctx.strokeStyle = stroke.color || '#231F20';
                ctx.fillStyle = stroke.color || '#231F20';
                ctx.lineWidth = stroke.size || 9;

                if (stroke.points.length === 1) {
                    const p = stroke.points[0];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, (stroke.size || 9) / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
                    for (let i = 1; i < stroke.points.length - 1; i++) {
                        const xc = (stroke.points[i].x + stroke.points[i + 1].x) / 2;
                        const yc = (stroke.points[i].y + stroke.points[i + 1].y) / 2;
                        ctx.quadraticCurveTo(stroke.points[i].x, stroke.points[i].y, xc, yc);
                    }
                    const last = stroke.points[stroke.points.length - 1];
                    ctx.lineTo(last.x, last.y);
                    ctx.stroke();
                }
            });
            ctx.restore();
        }

        function drawSelectionGizmo(ctx, bounds) {
            const { cx, cy, halfW, halfH, rotation, canDelete } = bounds;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotation || 0);

            ctx.strokeStyle = 'rgba(236, 72, 153, 0.9)';
            ctx.lineWidth = 3;
            ctx.setLineDash([9, 6]);
            ctx.strokeRect(-halfW, -halfH, halfW * 2, halfH * 2);
            ctx.setLineDash([]);

            // 旋转手柄 (左上)
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#EC4899';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-halfW, -halfH, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(-halfW, -halfH, 7.5, -Math.PI * 0.75, Math.PI * 0.65);
            ctx.stroke();

            // 删除按钮 (右上)
            if (canDelete) {
                ctx.fillStyle = '#F43F5E';
                ctx.beginPath();
                ctx.arc(halfW, -halfH, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(halfW - 6, -halfH - 6); ctx.lineTo(halfW + 6, -halfH + 6);
                ctx.moveTo(halfW + 6, -halfH - 6); ctx.lineTo(halfW - 6, -halfH + 6);
                ctx.stroke();
            }

            // 缩放手柄 (右下)
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#231F20';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(halfW, halfH, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(halfW - 6, halfH - 6); ctx.lineTo(halfW + 6, halfH + 6);
            ctx.moveTo(halfW + 1, halfH + 6); ctx.lineTo(halfW + 6, halfH + 6); ctx.lineTo(halfW + 6, halfH + 1);
            ctx.stroke();

            ctx.restore();
        }

        function drawSingleStickerShape(ctx, id) {
            if (id === 'sparkle') {
                ctx.beginPath();
                ctx.moveTo(0, -24); ctx.quadraticCurveTo(0, 0, 22, 0);
                ctx.quadraticCurveTo(0, 0, 0, 24); ctx.quadraticCurveTo(0, 0, -22, 0);
                ctx.quadraticCurveTo(0, 0, 0, -24); ctx.stroke();
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(24, 18); ctx.lineTo(24, 34);
                ctx.moveTo(16, 26); ctx.lineTo(32, 26); ctx.stroke();
            } else if (id === 'star') {
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const outerAngle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
                    const innerAngle = outerAngle + Math.PI / 5;
                    const ox = Math.cos(outerAngle) * 21, oy = Math.sin(outerAngle) * 21;
                    const ix = Math.cos(innerAngle) * 9.5, iy = Math.sin(innerAngle) * 9.5;
                    if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath(); ctx.stroke();
            } else if (id === 'heart') {
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.bezierCurveTo(-24, -4, -18, -22, 0, -8);
                ctx.bezierCurveTo(18, -22, 24, -4, 0, 15);
                ctx.stroke();
            } else if (id === 'swirl') {
                ctx.beginPath();
                for (let t = 0; t < Math.PI * 4.2; t += 0.2) {
                    const r = t * 1.9;
                    const px = Math.cos(t) * r, py = Math.sin(t) * r;
                    if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
            } else if (id === 'note') {
                ctx.beginPath();
                ctx.ellipse(-12, 14, 8, 6, -0.3, 0, Math.PI * 2);
                ctx.ellipse(12, 10, 8, 6, -0.3, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-5, 13); ctx.lineTo(-5, -16); ctx.lineTo(19, -20); ctx.lineTo(19, 9);
                ctx.moveTo(-5, -6); ctx.lineTo(19, -10);
                ctx.stroke();
            } else if (id === 'fishbone') {
                ctx.save();
                ctx.rotate(-0.35);
                ctx.beginPath();
                ctx.moveTo(-30, 0); ctx.lineTo(-14, -11); ctx.lineTo(-14, 11); ctx.closePath(); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-14, 0); ctx.lineTo(24, 0);
                ctx.moveTo(-3, -10); ctx.lineTo(-3, 10);
                ctx.moveTo(9, -8); ctx.lineTo(9, 8);
                ctx.moveTo(24, 0); ctx.lineTo(34, -9);
                ctx.moveTo(24, 0); ctx.lineTo(34, 9);
                ctx.stroke();
                ctx.restore();
            } else if (id === 'moon') {
                ctx.beginPath();
                ctx.arc(0, 0, 20, -0.4 * Math.PI, 0.7 * Math.PI);
                ctx.quadraticCurveTo(-8, 6, 0, -20);
                ctx.stroke();
            } else if (id === 'flower') {
                for (let a = 0; a < 5; a++) {
                    ctx.save();
                    ctx.rotate((a * Math.PI * 2) / 5);
                    ctx.beginPath();
                    ctx.ellipse(0, -12, 6, 9, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
                ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.stroke();
            } else if (id === 'paw') {
                ctx.beginPath(); ctx.ellipse(0, 7, 13, 10, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(-14, -6, 4.5, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(-5, -13, 4.5, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(5, -13, 4.5, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(14, -6, 4.5, 0, Math.PI * 2); ctx.stroke();
            } else if (id === 'crown') {
                ctx.beginPath();
                ctx.moveTo(-22, 14); ctx.lineTo(-26, -12); ctx.lineTo(-10, 2);
                ctx.lineTo(0, -18); ctx.lineTo(10, 2); ctx.lineTo(26, -12);
                ctx.lineTo(22, 14); ctx.closePath(); ctx.stroke();
            }
        }

        // ==========================================
        // 6. 14 款动物与本地照片线稿渲染库
        // ==========================================
        function drawCharacterIllustration(ctx, type, outlineColor = '#231F20') {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#231F20';
            ctx.lineWidth = 8.5;

            if (type === 'cat') {
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(-115, -35);
                ctx.quadraticCurveTo(-125, -125, -108, -135);
                ctx.quadraticCurveTo(-85, -125, -52, -88);
                ctx.quadraticCurveTo(0, -102, 52, -88);
                ctx.quadraticCurveTo(85, -125, 108, -135);
                ctx.quadraticCurveTo(125, -125, 115, -35);
                ctx.bezierCurveTo(145, 35, 95, 105, 0, 105);
                ctx.bezierCurveTo(-95, 105, -145, 35, -115, -35);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(-98, -75); ctx.lineTo(-95, -105); ctx.lineTo(-72, -82);
                ctx.moveTo(98, -75); ctx.lineTo(95, -105); ctx.lineTo(72, -82);
                ctx.stroke();

                ctx.fillStyle = '#F9A8D4';
                ctx.beginPath();
                ctx.ellipse(-68, 22, 18, 11, 0, 0, Math.PI * 2);
                ctx.ellipse(68, 22, 18, 11, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#231F20';
                ctx.beginPath();
                ctx.arc(-45, 4, 8.5, 0, Math.PI * 2);
                ctx.arc(45, 4, 8.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 6.5;
                ctx.beginPath(); ctx.ellipse(0, 14, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-22, 26); ctx.quadraticCurveTo(-11, 38, 0, 24);
                ctx.quadraticCurveTo(11, 38, 22, 26);
                ctx.stroke();

                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(-105, -2); ctx.lineTo(-148, -10);
                ctx.moveTo(-108, 16); ctx.lineTo(-152, 18);
                ctx.moveTo(-102, 34); ctx.lineTo(-142, 44);
                ctx.moveTo(105, -2); ctx.lineTo(148, -10);
                ctx.moveTo(108, 16); ctx.lineTo(152, 18);
                ctx.moveTo(102, 34); ctx.lineTo(142, 44);
                ctx.stroke();

            } else if (type === 'puppy') {
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(-110, -40);
                ctx.quadraticCurveTo(0, -110, 110, -40);
                ctx.bezierCurveTo(145, 45, 95, 100, 0, 100);
                ctx.bezierCurveTo(-95, 100, -145, 45, -110, -40);
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-88, -72);
                ctx.bezierCurveTo(-165, -45, -195, 45, -142, 62);
                ctx.bezierCurveTo(-105, 70, -82, 15, -75, -15);
                ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(88, -72);
                ctx.bezierCurveTo(165, -45, 195, 45, 142, 62);
                ctx.bezierCurveTo(105, 70, 82, 15, 75, -15);
                ctx.fill(); ctx.stroke();

                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.moveTo(-25, -42); ctx.quadraticCurveTo(-20, -28, -28, -22);
                ctx.moveTo(-8, -45); ctx.quadraticCurveTo(-3, -30, -11, -24);
                ctx.moveTo(10, -44); ctx.quadraticCurveTo(15, -29, 7, -23);
                ctx.moveTo(26, -40); ctx.quadraticCurveTo(31, -26, 23, -20);
                ctx.stroke();

                ctx.fillStyle = '#FBCFE8';
                ctx.beginPath();
                ctx.arc(-44, 62, 13, 0, Math.PI * 2);
                ctx.arc(44, 62, 13, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#231F20';
                ctx.lineWidth = 5.5;
                ctx.beginPath();
                ctx.moveTo(-36, 26); ctx.lineTo(-22, 21);
                ctx.moveTo(36, 26); ctx.lineTo(22, 21);
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(-28, 44, 7.5, 10, 0, 0, Math.PI * 2);
                ctx.ellipse(28, 44, 7.5, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(0, 62, 9, 7, 0, 0, Math.PI * 2);
